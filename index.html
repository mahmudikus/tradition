  .scene>*{position:relative;z-index:1}

  .shake{animation:shake .25s 3}

const state = {

/* ============ ХЕЛПЕРЫ ============ */
const flag = n => !!state.flags[n];
const rel  = n => state.relations[n] ?? 0;
const setRel = (n,d) => { state.relations[n] = Math.max(-10,Math.min(10,rel(n)+d)); };
const setMental = d => { state.mental = Math.max(1,Math.min(10,state.mental+d)); };
const schedule = (days,event) => state.timers.push({day:state.day+days,event});
const checkTimers = () => {
  const due = state.timers.filter(t=>t.day<=state.day);
  state.timers = state.timers.filter(t=>t.day>state.day);
  return due;
};
const starStr = n => "★".repeat(n)+"☆".repeat(10-n);
const g  = (m,f) => state.gender === "girl" ? f : m;
const he = () => state.gender === "girl" ? "она" : "он";
const his = () => state.gender === "girl" ? "её" : "его";
const lowMentalActive = () => state.mental <= 2;
const glance = () => lowMentalActive() ? "Люди отводят взгляды. " : "";

function timeSkip(days){
  state.day += days;
  for(const [age,t] of Object.entries(AGE_TRANSITIONS)){
    if(state.day >= t.atDay && state.age < t.to){
      state.age = t.to;
      state.flags["age_"+t.to] = true;
    }
  }
}

/* ============ ЛЕНА ============ */
function lenaProtect(){
  state.flags.lena_protect_count = (state.flags.lena_protect_count||0) + 1;
  setRel("lena", +1);
  if (state.flags.lena_protect_count >= 4 && !flag("lena_dead")) {
    state.flags.lena_dead = true;
    return "lena_death";
  }
  return null;
}
function lenaUse(){
  state.flags.lena_used_count = (state.flags.lena_used_count||0) + 1;
  setRel("lena", -2);
  if (state.flags.lena_used_count >= 3 && !flag("lena_left")) {
    state.flags.lena_left = true;
    return "lena_leaves";
  }
  return null;
}

/* ============ ЗВУК ============ */
let audioCtx=null;
const getCtx=()=>audioCtx||(audioCtx=new (window.AudioContext||window.webkitAudioContext)());
function playSfx(name){
  try{
    const ctx=getCtx();
    if(ctx.state==="suspended")ctx.resume();
    if(name==="glitch"){
      const dur=.25,buf=ctx.createBuffer(1,ctx.sampleRate*dur,ctx.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
      const s=ctx.createBufferSource();s.buffer=buf;
      const gn=ctx.createGain();
      gn.gain.setValueAtTime(.4,ctx.currentTime);
      gn.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);
      s.connect(gn).connect(ctx.destination);s.start();
    }
    if(name==="heartbeat"){
      const beat=(t,f,v)=>{const o=ctx.createOscillator(),gn=ctx.createGain();
        o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.5,t+.15);
        gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+.2);
        o.connect(gn).connect(ctx.destination);o.start(t);o.stop(t+.25);
      };
      const n=ctx.currentTime;beat(n,90,.5);beat(n+.25,70,.35);
    }
  }catch(e){}
}

/* ============ ДВИЖОК ============ */
const app = document.getElementById("app");

function shake(){
  const el = document.querySelector(".scene") || app;
  el.classList.add("shake");
  setTimeout(()=>el.classList.remove("shake"),800);
}

function die(cause, atAge, killer=null){
  state.deathCause = DEATHS[cause] || cause;
  state.deathAge = atAge;
  state.killer = killer;
  showDeath();
}

function buildEpilogue(){
  const parts = [`Ты умер в ${state.deathAge} лет.`,`Причина: ${state.deathCause}.`];
  const r = n => state.relations[n] ?? 0;

  if(state.killer && r(state.killer)<=-5) parts.push("Это сделал тот, кого ты когда-то обидел.");
  if(r("mother")>=5) parts.push("Мать не пережила. Она приходила на могилу каждый день.");
  else if(r("mother")<=-3) parts.push("Мать узнала слишком поздно. Она даже не пришла.");
  if(r("anya")>=3) parts.push("Аня пришла на похороны. Она плакала.");
  else if(r("anya")<=-5) parts.push("Аня не пришла. Она знала, что так будет.");
  if(r("lena")>=5) parts.push("Лена была рядом до конца.");
  else if(r("lena")<=-5) parts.push("Лена не пришла. Ты сам её оттолкнул.");
  if(r("child")>=3) parts.push("Твой ребёнок держал тебя за руку.");

  if(state.mental<=2) parts.push("Психика была разрушена задолго до конца.");
  else if(state.mental>=8) parts.push("До последнего дня ты сохранял ясность.");

  if(flag("kind")) parts.push("Кто-то вспомнил, что ты был добр.");
  if(flag("basement_seen")) parts.push("Ты так и не рассказал никому про подвал.");
  if(flag("joined_ritual")) parts.push("Ритуал не закончился. Он продолжился в тебе.");
  if(flag("told_truth")) parts.push("Твой ребёнок узнал правду. И не испугался.");
  if(flag("told_lie")) parts.push("Ты соврал ребёнку так же, как когда-то тебе.");
  if(flag("accepted")) parts.push("Ты улыбнулся. Оно улыбнулось в ответ.");
  if(flag("beat_child")) parts.push("Ты стал тем, кого боялся в детстве.");
  if(flag("pyro")) parts.push("Огонь шёл за тобой всю жизнь.");
  if(flag("bully")) parts.push("Ты так и не извинился перед Аней.");
  if(flag("psych_ward")) parts.push("Тебя держали в психушке. Ты умер там.");
  if(flag("killed_someone")) parts.push("Ты убил человека. Это осталось с тобой.");
  if(flag("lena_dead")) parts.push("Лена умерла, защищая тебя. Ты не смог её спасти.");
  if(flag("lena_left")) parts.push("Лена отвернулась от тебя. Ты остался один.");

  if(state.guilt>5) parts.push("Последнее, что ты чувствовал — вина.");
  if(state.fear>10) parts.push("Последнее, что ты чувствовал — страх.");

  const key=[
    state.deathCause,state.deathAge,state.killer||"-",
    flag("kind")?"k":"-",flag("grudge")?"g":"-",
    flag("lena_dead")?"ld":"-",flag("lena_left")?"ll":"-",
    flag("psych_ward")?"pw":"-",flag("killed_someone")?"ks":"-",
    state.mental<=2?"m2":"-",state.mental>=8?"m8":"-",
  ].join("_");
  state.seenEndings.add(key);

  return parts.join(" ");
}

function showDeath(){
  const ep = buildEpilogue();
  playSfx("heartbeat");
  app.classList.add("fade-out");
  setTimeout(()=>{
    app.innerHTML=`
      <div class="death-screen">
        <p>${ep}</p>
        <p class="counter">Концовка: ${state.seenEndings.size} · Возраст: ${state.deathAge} · Дней: ${state.day}</p>
        <button id="restart">Начать заново</button>
      </div>`;
    document.getElementById("restart").onclick=()=>location.reload();
    app.classList.remove("fade-out");
  },300);
}

function playScene(id){
  if(id==="next_day"||id==="auto_day") return nextDay();
  const scene = scenes[id];
  if(!scene) return console.error("Нет сцены:",id);

  const due = checkTimers();
  if(due.length && !id.startsWith("event_")) return playScene("event_"+due[0].event);

  if(scene.when && !scene.when()) return playScene("next_day");

  if(flag("killed_someone") && !flag("psych_ward") && !flag("psych_checked") && !flag("psych_escaped") && !flag("psych_faked")){
    state.flags.psych_checked = true;
    state.flags.psych_ward = true;
    state.flags.psych_start_day = state.day;
    setMental(-5);
    return playScene("psych_ward");
  }

  render(scene);
}

function render(scene){
  app.classList.add("fade-out");
  setTimeout(()=>{
    const mentClass = state.mental<=2 ? "low" : "";
    app.innerHTML=`
      <div class="scene">
        <div class="scene-inner">
          <div class="status">
            <span>${state.name}</span>
            <span>${state.age} лет</span>
            <span class="${mentClass}">Психика: ${starStr(state.mental)}</span>
            <span>Карма: ${state.karma}</span>
          </div>
          <p class="text">${scene.text}</p>
          <div class="choices"></div>
        </div>
      </div>`;
    const sceneEl = app.querySelector(".scene");
    sceneEl.style.background = BG[scene.bg] || BG.home;

    const box = app.querySelector(".choices");
    if(scene.choices){
      scene.choices.forEach(c=>{
        const b = document.createElement("button");
        b.textContent = c.text;
        b.onclick = ()=>{
          getCtx();
          c.effects?.();
          if(state.deathCause) return;
          playScene(c.next || "next_day");
        };
        box.appendChild(b);
      });
    } else {
      const b = document.createElement("button");
      b.textContent = "Дальше";
      b.onclick = ()=>{getCtx();playScene(scene.next||"next_day");};
      box.appendChild(b);
    }
    app.classList.remove("fade-out");
  },300);
}

function nextDay(){
  state.day += 1;
  if(flag("killed_someone")) setMental(-1);
  if(state.fear>8) setMental(-1);
  if(state.guilt>8) setMental(-1);

  for(const [age,t] of Object.entries(AGE_TRANSITIONS)){
    if(state.day === t.atDay && state.age === Number(age)){
      state.age = t.to;
      state.flags["age_"+t.to] = true;
    }
  }
  autoDay();
}

/* ============ ПЛАНИРОВЩИК ============ */
const AGE_TRANSITIONS = {
  6:{atDay:365,to:12},
  12:{atDay:2555,to:16},
  16:{atDay:3285,to:19},
  19:{atDay:4380,to:23},
  23:{atDay:5110,to:35},
  35:{atDay:12775,to:65},
};

const DAY_POOL = {
  6:["home_age6","park_age7","neutral_dinner","neutral_weather","absurd_chalk_age10","steal_age10"],
  12:["school_age12","school_bully_age12","lena_neutral_food","lena_neutral_dream",
      "school_corridor_age13","beat_classmate_age13","neutral_weather","neutral_period",
      "neutral_voice","absurd_aliens_age11","school_use_lena","low_mental_glances","low_mental_school"],
  16:["club_age16","forest_age17","school_use_lena","lena_needs_help_age14",
      "lena_protect_serious_age15","push_from_roof_age16","absurd_president_age17","neutral_weather"],
  19:["uni_age19","love_age20","alcohol_age19","drugs_age20","accident_age22","job_age22","low_mental_glances"],
  23:["career_age25","marriage_age28","child_birth_age30","affair_age32","midlife_age40","low_mental_glances"],
  35:["family_age35","parents_die_age45","health_age50","friend_die_age55","divorce_age52","low_mental_glances"],
  65:["old_age65","old_70","old_75","old_80","old_85","old_90"],
};

function autoDay(){
  // психушка
  if(flag("psych_ward") && !flag("psych_escaped") && !flag("psych_faked") && !flag("psych_kill_done")){
    const startDay = state.flags.psych_start_day || state.day;
    if(state.day >= startDay + 365){
      state.flags.psych_kill_done = true;
      return playScene("psych_kill");
    }
    return playScene("psych_ward_loop");
  }
  // месть Ани
  if(flag("grudge") && rel("anya")<-3 && state.age>=16 && state.age<45 && !flag("revenge_done")){
    state.flags.revenge_done = true;
    return playScene("event_anya_revenge");
  }
  // кома
  if(state.age===23 && !flag("coma_done")){state.flags.coma_done=true;return playScene("coma_age23");}
  // возвращение
  if(state.age===45 && flag("grudge") && rel("anya")<-3 && !flag("return_done")){
    state.flags.return_done=true; return playScene("return_age45");
  }
  // старость
  if(state.age>=65){
    if(!flag("old_done")){state.flags.old_done=true;return playScene("old_age65");}
    return playScene("old_age_loop");
  }
  // низкая психика
  if(lowMentalActive() && !flag("low_mental_seen") && Math.random()<.4){
    state.flags.low_mental_seen = true;
    return playScene("low_mental_glances");
  }
  const pool = DAY_POOL[state.age] || ["day_start"];
  playScene(pool[Math.floor(Math.random()*pool.length)]);
}

/* ============ СТАРТ ============ */
function startScreen(){
  app.classList.remove("fade-out");
  app.innerHTML = `
    <div class="scene">
      <div class="scene-inner">
        <div class="status"><span>Новая жизнь</span></div>
        <p class="text">Как тебя зовут?</p>
        <input id="nameInput" class="name-input" maxlength="20" placeholder="Имя" autocomplete="off">
        <div class="choices"><button id="btnOk">Дальше</button></div>
      </div>
    </div>`;
  const input = document.getElementById("nameInput");
  input.focus();
  const go = () => {
    const v = input.value.trim();
    if(v.length < 1){ input.placeholder = "Введи имя"; input.focus(); return; }
    state.name = v;
    genderScreen();
  };
  document.getElementById("btnOk").onclick = go;
  input.onkeydown = e => { if(e.key === "Enter") go(); };
}

function genderScreen(){
  app.innerHTML = `
    <div class="scene">
      <div class="scene-inner">
        <div class="status"><span>Имя: ${state.name}</span></div>
        <p class="text">Ты девочка или мальчик?</p>
        <div class="choices">
          <button data-g="girl">Девочка</button>
          <button data-g="boy">Мальчик</button>
        </div>
      </div>
    </div>`;
  document.querySelectorAll("[data-g]").forEach(b=>{
    b.onclick = ()=>{
      state.gender = b.dataset.g;
      scenes = initScenes();
      playScene("home_age6");
    };
  });
}

/* ============ ЗАПУСК ============ */
startScreen();
</script>
