<style>

  body{margin:0;background:#0a0a0a;color:#ddd;font-family:'Courier New',monospace;min-height:100vh}
  #app{min-height:100vh;transition:opacity .35s ease}
  #app.fade-out{opacity:0}
  .scene{position:relative;min-height:100vh;padding:4rem 2rem;background:#111 center/cover no-repeat;animation:fadeIn .5s ease}
  .scene::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:0}
  .scene>*{position:relative;z-index:1}
  .scene-inner{max-width:720px;margin:0 auto}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .text{font-size:1.15rem;line-height:1.65;margin-bottom:1rem;min-height:3em;text-shadow:0 2px 6px rgba(0,0,0,.9)}
  .after-text{font-size:1.1rem;line-height:1.7;color:#ccc;font-style:italic}
  .status{font-size:.85rem;color:#888;margin-bottom:1.5rem;letter-spacing:.05em}
  .status span{margin-right:1rem}
  .status .low{color:#c33}
  .choices button{display:block;width:100%;margin:.5rem 0;padding:.8rem 1rem;background:rgba(20,20,20,.85);color:#eee;border:1px solid #333;cursor:pointer;font-family:inherit;font-size:1rem;text-align:left;transition:background .2s,transform .1s,border-color .2s}
  .choices button:hover{background:rgba(40,40,40,.95);transform:translateX(4px);border-color:#555}
  .name-input{width:100%;padding:.8rem 1rem;background:rgba(20,20,20,.85);color:#eee;border:1px solid #333;font-family:inherit;font-size:1.1rem;margin-bottom:1rem}
  .name-input:focus{outline:none;border-color:#666}
  .death-screen{min-height:100vh;padding:6rem 2rem;text-align:center;max-width:720px;margin:0 auto;animation:fadeIn .6s ease;display:flex;flex-direction:column;justify-content:center}

  .death-screen button{margin:2rem auto 0;padding:.8rem 2rem;background:transparent;color:#eee;border:1px solid #555;cursor:pointer;font-family:inherit;font-size:1rem}

  .shake{animation:shake .25s 3}

/* ============ СОСТОЯНИЕ ============ */
const state = {
  name:"", gender:"boy",
  y:2015, m:11, d:28, age:6, day:0,
  fear:0, guilt:0, stamina:10, karma:0, mental:10,
  flags:{}, relations:{}, timers:[],
  deathCause:null, deathAge:null, killer:null,
  seenEndings:new Set(),
  thingLevel:0, thingNextMonth:3,
  recentScenes:[],

/* ============ ХЕЛПЕРЫ ============ */
const MONTHS = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
const fmtDate = () => `${MONTHS[state.m-1]} ${state.y}`;
const flag = n => !!state.flags[n];
const rel  = n => state.relations[n] ?? 0;
const setRel = (n,d) => { state.relations[n] = Math.max(-10,Math.min(10,rel(n)+d)); };
const setMental = d => { state.mental = Math.max(1,Math.min(10,state.mental+d)); };
const schedule = (months,event) => state.timers.push({day:state.day+months,event});
const checkTimers = () => {
  const due = state.timers.filter(t=>t.day<=state.day);
  state.timers = state.timers.filter(t=>t.day>state.day);
  return due;
};
const starStr = n => "★".repeat(n)+"☆".repeat(10-n);
const g  = (m,f) => state.gender === "girl" ? f : m;
const he = () => state.gender === "girl" ? "она" : "он";
const lowMentalActive = () => state.mental <= 2;
const glance = () => lowMentalActive() ? "Люди отводят взгляды. " : "";
const pickScene = pool => {
  const avail = pool.filter(s => !state.recentScenes.includes(s));
  const src = avail.length ? avail : pool;
  const pick = src[Math.floor(Math.random()*src.length)];
  state.recentScenes.push(pick);
  if(state.recentScenes.length > 6) state.recentScenes.shift();
  return pick;
};

/* ============ ЛЕНА ============ */
function lenaProtect(){
  state.flags.lena_protect_count = (state.flags.lena_protect_count||0) + 1;
  setRel("lena", +1);
  if (state.flags.lena_protect_count >= 4 && !flag("lena_dead")) {
    state.flags.lena_dead = true;
    return "lena_death";
  }
  return null;
}
function lenaUse(){
  state.flags.lena_used_count = (state.flags.lena_used_count||0) + 1;
  setRel("lena", -2);
  if (state.flags.lena_used_count >= 3 && !flag("lena_left")) {
    state.flags.lena_left = true;
    return "lena_leaves";
  }
  return null;
}

/* ============ ЗВУК ============ */
let audioCtx=null;
const getCtx=()=>audioCtx||(audioCtx=new (window.AudioContext||window.webkitAudioContext)());
function playSfx(name){
  try{
    const ctx=getCtx();
    if(ctx.state==="suspended")ctx.resume();
    if(name==="glitch"){
      const dur=.25,buf=ctx.createBuffer(1,ctx.sampleRate*dur,ctx.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
      const s=ctx.createBufferSource();s.buffer=buf;
      const gn=ctx.createGain();
      gn.gain.setValueAtTime(.4,ctx.currentTime);
      gn.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);
      s.connect(gn).connect(ctx.destination);s.start();
    }
    if(name==="heartbeat"){
      const beat=(t,f,v)=>{const o=ctx.createOscillator(),gn=ctx.createGain();
        o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.5,t+.15);
        gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+.2);
        o.connect(gn).connect(ctx.destination);o.start(t);o.stop(t+.25);
      };
      const n=ctx.currentTime;beat(n,90,.5);beat(n+.25,70,.35);
    }
  }catch(e){}
}

    {text:"Быть рядом", effects:()=>{setRel("mother",+2);setMental(-2);}, next:"next_day"},
    {text:"Уйти", effects:()=>{setRel("mother",-5);setMental(-3);}, next:"next_day"},
    {text:"Сказать «я ненавижу тебя»", effects:()=>{setRel("mother",-10);setMental(-5);}, next:"next_day"},
  ]},
health_age50: { bg:"hospital", text:`${glance()}Анализы плохие. Врач: «Есть варианты».`,
  choices:[
    {text:"Лечиться", effects:()=>{if(Math.random()<.7){}else die("cancer",50);}, next:"next_day"},
    {text:"Отказаться", effects:()=>{die("cancer",50);}},
    {text:"Народная медицина", effects:()=>{if(Math.random()<.3)die("wrong_med",50);}, next:"next_day"},
  ]},
friend_die_age55: { bg:"street", text:`${glance()}Умирает старый друг. На похоронах — почти никого.`,
  choices:[
    {text:"Пойти", effects:()=>{setMental(-1);}, next:"next_day"},
    {text:"Не пойти", effects:()=>{setMental(-2);}, next:"next_day"},
    {text:"Напиться", effects:()=>{setMental(-2);if(Math.random()<.1)die("poisoned",55);}, next:"next_day"},
  ]},
divorce_age52: { bg:"home", text:`${glance()}Партнёр подаёт на развод.`,
  when:()=>state.flags.married,
  choices:[
    {text:"Согласиться", effects:()=>{setMental(-2);}, next:"next_day"},
    {text:"Бороться", effects:()=>{setMental(-3);if(Math.random()<.3)die("heart",52);}, next:"next_day"},
    {text:"Убить партнёра", effects:()=>{state.karma-=20;state.flags.killed_someone=true;}, next:"next_day"},
  ]},

/* ========== 65+ ========== */
old_age65: { bg:"home", text:`${fmtDate()}. Выход на пенсию. Внуки играют во дворе.`,
  choices:[
    {text:"Позвать их", effects:()=>{setMental(+1);}, next:"next_day"},
    {text:"Закрыть шторы", effects:()=>{setMental(-1);}, next:"next_day"},
    {text:"Написать письмо в прошлое", effects:()=>{setMental(+1);}, next:"next_day"},
  ]},
old_70: { bg:"home", text:`70. Врач: «Вам нельзя одному».`,
  choices:[
    {text:"Переехать к детям", effects:()=>{if(rel("child")>=3)setMental(+1);else setMental(-2);}, next:"next_day"},
    {text:"Нанять сиделку", effects:()=>{}, next:"next_day"},
    {text:"Остаться одному", effects:()=>{setMental(-2);}, next:"next_day"},
  ]},
old_75: { bg:"home", text:`75. Память подводит. Ты забываешь имена.`,
  choices:[
    {text:"Записывать всё", effects:()=>{setMental(+1);}, next:"next_day"},
    {text:"Смириться", effects:()=>{setMental(-2);}, next:"next_day"},
    {text:"Рассказать внукам", effects:()=>{setMental(+2);}, next:"next_day"},
  ]},
old_80: { bg:"home", text:`80. Врач: «Вам осталось немного».`,
  choices:[
    {text:"Позвать всех", effects:()=>{if(rel("child")>=3||rel("lena")>=5)die("old_family",80);else die("old_alone",80);}},
    {text:"Молиться", effects:()=>{die("old_faith",80);}},
    {text:"Принять таблетки", effects:()=>{die("pills",80);}},
    {text:"Просто сидеть", effects:()=>{die("old_sleep",80);}},
  ]},
old_85: { bg:"home", text:`85. Кто-то стучит в дверь.`,
  choices:[
    {text:"Открыть", effects:()=>{if(flag("accepted"))die("old_family",85);else die("ghost",85);}},
    {text:"Не открывать", effects:()=>{die("old_alone",85);}},
  ]},
old_90: { bg:"home", text:`90. Ты — легенда района.`,
  choices:[
    {text:"Собрать всех", effects:()=>{die("old_family",90);}},
    {text:"Уйти тихо", effects:()=>{die("old_sleep",90);}},
    {text:"Сказать «я устал»", effects:()=>{die("old_age",90);}},
  ]},
old_age_loop: { bg:"home", text:`${fmtDate()}. Ещё год. ${glance()}Вопрос — зачем?`,
  choices:[
    {text:"Продолжать", effects:()=>{
      if(state.age<70) playScene("old_70");
      else if(state.age<75) playScene("old_75");
      else if(state.age<80) playScene("old_80");
      else if(state.age<85) playScene("old_85");
      else if(state.age<90) playScene("old_90");
      else die("old_age",state.age);
    }},
    {text:"Закончить самому", effects:()=>{die("pills",state.age);}},
    {text:"Позвонить Лене", effects:()=>{
      if(flag("lena_dead")||flag("lena_left")) die("old_alone",state.age);
      else { setRel("lena",+2); setMental(+2); }
    }, next:"next_day"},
  ]},

/* ========== ДЕНЬ РОЖДЕНИЯ ========== */
birthday: { bg:"home", text:`Сегодня твой день рождения. ${state.age} лет. Мать ставит торт.`,
  choices:[
    {text:"Задуть свечи", effects:()=>{setMental(+2);}, next:"next_day",
     after:`Ты задуваешь. Один огонёк не гаснет. Дуешь ещё — исчезает. Мать улыбается, но глаза грустные.`},
    {text:"Позвать друзей", effects:()=>{setMental(+1);}, next:"birthday_guests"},
    {text:"Тихо посидеть", effects:()=>{setMental(-1);}, next:"next_day"},
  ]},
birthday_guests: { bg:"home", text:`${flag("lena_friend") && !flag("lena_left") && !flag("lena_dead") ? "Лена пришла. Принесла самодельную открытку." : "Никто не пришёл."}`,
  choices:[
    {text:"Поблагодарить", effects:()=>{setMental(+1);if(flag("lena_friend"))setRel("lena",+1);}, next:"next_day"},
    {text:"Устроить скандал", effects:()=>{setMental(-2);if(flag("lena_friend"))setRel("lena",-3);}, next:"next_day"},
  ]},
birthday_teen: { bg:"home", text:`${state.age}. День рождения.`,
  when:()=>state.age>=12&&state.age<19,
  choices:[
    {text:"Вечеринку", effects:()=>{setMental(+2);}, next:"birthday_party_teen"},
    {text:"С семьёй", effects:()=>{setRel("mother",+1);setMental(+1);}, next:"next_day"},
    {text:"Сбежать", effects:()=>{setMental(-2);}, next:"birthday_runaway"},
  ]},
birthday_party_teen: { bg:"home", text:`Кто-то предлагает «кое-что поинтереснее».`,
  choices:[
    {text:"Попробовать", effects:()=>{setMental(-2);}, next:"next_day"},
    {text:"Отказаться", effects:()=>{setMental(+1);}, next:"next_day"},
  ]},
birthday_runaway: { bg:"street", text:`Ночь. Куда идти?`,
  choices:[
    {text:"К Лене", effects:()=>{if(flag("lena_left")||flag("lena_dead")){setMental(-2);return;}setRel("lena",+2);setMental(+1);}, next:"next_day"},
    {text:"Просто гулять", effects:()=>{setMental(-1);}, next:"next_day"},
  ]},
birthday_adult: { bg:"home", text:`${state.age} лет. День рождения.`,
  when:()=>state.age>=19&&state.age<65,
  choices:[
    {text:"С близкими", effects:()=>{setMental(+2);}, next:"next_day"},
    {text:"Работать", effects:()=>{setMental(-1);}, next:"next_day"},
    {text:"Напиться", effects:()=>{setMental(-2);}, next:"next_day"},
  ]},
birthday_old: { bg:"home", text:`${state.age} лет. День рождения.`,
  when:()=>state.age>=65,
  choices:[
    {text:"Принять гостей", effects:()=>{if(rel("child")>=3||rel("lena")>=5)setMental(+2);else setMental(-1);}, next:"next_day"},
    {text:"Побыть одному", effects:()=>{setMental(-1);}, next:"next_day"},
  ]},

/* ========== СУЩНОСТЬ (5 уровней) ========== */
thing_event_1: { bg:"home", text:`${fmtDate()}. Ночью просыпаешься от холода. Одеяло сброшено. В углу — тень. Слишком густая.`,
  choices:[
    {text:"Смотреть", effects:()=>{state.fear+=3;}, next:"next_day",
     after:`Тень не двигается. Но ты чувствуешь: она смотрит в ответ. Утром на полу — мокрый след к двери подвала.`},
    {text:"Закрыть глаза", effects:()=>{setMental(-1);}, next:"next_day"},
    {text:"Позвать мать", effects:()=>{setRel("mother",+1);}, next:"thing_warn_1"},
  ]},
thing_warn_1: { bg:"home", text:`Мать на краю кровати. «Что ты видел?»`,
  choices:[
    {text:"Сказать правду", effects:()=>{setRel("mother",+1);}, next:"next_day",
     after:`Ты рассказываешь. Она молчит. Потом: «Не говори отцу. Он не поймёт». Уходит.`},
    {text:"Соврать", effects:()=>{setRel("mother",-1);}, next:"next_day"},
  ]},
thing_event_2: { bg:"home", text:`${fmtDate()}. В подвале — старая фотография. Семья. Не твоя. У всех стёрты лица.`,
  choices:[
    {text:"Взять себе", effects:()=>{state.fear+=2;}, next:"next_day",
     after:`Прячешь под матрас. Ночью фото оказывается на подушке. Ты не брал его.`},
    {text:"Показать матери", effects:()=>{}, next:"thing_warn_2",
     after:`Мать берёт фото. Долго смотрит. Бросает в огонь. «Не трогай больше ничего в подвале».`},
    {text:"Сжечь самому", effects:()=>{state.fear-=1;}, next:"next_day"},
  ]},
thing_warn_2: { bg:"home", text:`Мать у окна. «Ты давно видишь… его?» — не оборачиваясь.`,
  choices:[
    {text:"«Да. С шести лет»", effects:()=>{state.flags.mother_believes=true;}, next:"next_day",
     after:`Она оборачивается. В глазах страх — не за себя. За тебя. «Я знала. Я надеялась, оно выберет меня».`},
    {text:"«Нет»", effects:()=>{}, next:"next_day"},
  ]},
thing_event_3: { bg:"basement", text:`${fmtDate()}. На стене подвала свежая надпись. «ОН РАСТЁТ».`,
  choices:[
    {text:"Сфотографировать", effects:()=>{}, next:"next_day",
     after:`На снимке — пустая стена. Надпись видна только глазами.`},
    {text:"Показать отцу", effects:()=>{setRel("father",-1);}, next:"thing_warn_father",
     after:`Отец спускается. «Какая надпись? Тут ничего нет». Уходит. Ты стоишь перед пустой стеной.`},
    {text:"Стереть", effects:()=>{state.fear+=2;}, next:"next_day",
     after:`Краска не стирается. Утром надпись другая: «ТЫ ТОЖЕ».`},
  ]},
thing_warn_father: { bg:"home", text:`Отец на кухне. «Мать говорит, ты видишь вещи».`,
  choices:[
    {text:"Рассказать всё", effects:()=>{if(flag("mother_believes"))state.flags.father_believes=true;}, next:"next_day",
     after:`Ты рассказываешь. Он долго молчит. «Завтра спущусь сам». Не спускается.`},
    {text:"Отпереться", effects:()=>{setRel("father",-2);}, next:"next_day"},
  ]},
thing_event_4: { bg:"home", text:`${fmtDate()}. Крик. Мать в коридоре. Перед ней — дверь подвала. Открытая.`,
  choices:[
    {text:"Закрыть дверь", effects:()=>{setRel("mother",+2);}, next:"next_day",
     after:`Захлопываешь. Мать приходит в себя. «Спасибо». Больше не смеётся над «тенью».`},
    {text:"Заглянуть", effects:()=>{state.fear+=5;setMental(-2);}, next:"thing_face",
     after:`В темноте — глаза. Не два. Больше. Смотрят снизу вверх, как ребёнок на родителя.`},
    {text:"Разбудить отца", effects:()=>{}, next:"next_day",
     after:`Отец ворчит, но идёт. Закрывает дверь. Утром замок сломан.`},
  ]},
thing_face: { bg:"basement", text:`Не тень. Существо. Сидит на нижней ступеньке. У него твоё лицо — но взрослое.`,
  choices:[
    {text:"«Что тебе надо?»", effects:()=>{state.fear+=3;}, next:"thing_answer"},
    {text:"Убежать", effects:()=>{setMental(-2);}, next:"next_day"},
  ]},
thing_answer: { bg:"basement", text:`«Тебя. Когда останешься один. Твои родители… они мешают».`,
  choices:[
    {text:"«Не тронь их»", effects:()=>{state.fear+=2;}, next:"next_day",
     after:`«Тогда защити их. Если сможешь». Исчезает. Ты больше не запираешь дверь.`},
    {text:"Молчать", effects:()=>{setMental(-3);}, next:"next_day"},
  ]},
thing_event_5: { bg:"home", text:`${fmtDate()}. Просыпаешься от тишины. Слишком тихо. Дом пустой. Мать и отец не вернулись.`,
  choices:[
    {text:"Искать их", effects:()=>{state.fear+=5;}, next:"thing_parents_gone",
     after:`Ищешь везде. В подвале — открытая дверь. Внутри — два силуэта в углу. Слишком тихие.`},
    {text:"Позвонить в полицию", effects:()=>{}, next:"thing_parents_gone",
     after:`Полиция приезжает. Ничего не находят. Тебя забирают в детский дом.`},
  ]},
thing_parents_gone: { bg:"basement", text:`Два тела. Мать и отец. Держатся за руки. На стене: «ТЕПЕРЬ ТЫ СВОБОДЕН».`,
  choices:[
    {text:"Крикнуть", effects:()=>{state.flags.orphan=true;setMental(-5);}, next:"next_day"},
    {text:"Взять что-то на память", effects:()=>{state.flags.orphan=true;setMental(-3);}, next:"next_day"},
  ]},

/* ========== ДЕТДОМ ========== */
orphan_home: { bg:"orphanage", text:`${fmtDate()}. Детский дом. Восемь детей в комнате. «${state.name}, вот твоя койка».`, next:"orphan_intro"},
orphan_intro: { bg:"orphanage", text:`Первая ночь. Старший улыбается. «Ты новенький. Плати дань».`,
  choices:[
    {text:"Дать сдачи", effects:()=>{if(state.stamina>5)state.stamina-=2;else die("beaten",state.age);}, next:"next_day",
     after:`Ты бьёшь первым. Он падает. Больше тебя не трогают. Но и не дружат.`},
    {text:"Отдать вещи", effects:()=>{setMental(-2);}, next:"next_day"},
    {text:"Позвать воспитателя", effects:()=>{setMental(-1);}, next:"next_day"},
  ]},
orphan_bully: { bg:"orphanage", text:`${fmtDate()}. Старшие заперли тебя в чулане. «Посиди, пока не заплачешь».`,
  choices:[
    {text:"Плакать", effects:()=>{setMental(-2);}, next:"next_day"},
    {text:"Молчать", effects:()=>{setMental(-1);}, next:"next_day"},
    {text:"Сломать дверь", effects:()=>{if(state.stamina>6)state.stamina-=3;else die("beaten",state.age);}, next:"next_day"},
  ]},
orphan_caretaker: { bg:"orphanage", text:`${fmtDate()}. Воспитательница: «${state.name}, иди сюда. Мне нужна помощь».`,
  choices:[
    {text:"Пойти", effects:()=>{if(Math.random()<.5)setMental(-4);else setMental(+1);}, next:"next_day"},
    {text:"«Я занят»", effects:()=>{setMental(-1);}, next:"next_day"},
    {text:"Крикнуть", effects:()=>{setMental(-1);}, next:"next_day"},
  ]},
orphan_adoption: { bg:"orphanage", text:`${fmtDate()}. Приехала пара. Взгляд останавливается на тебе. «Этот?»`,
  choices:[
    {text:"Улыбнуться", effects:()=>{state.flags.orphan=false;setMental(+2);}, next:"next_day",
     after:`Ты улыбаешься. Через неделю уезжаешь. В новую жизнь.`},
    {text:"Отвернуться", effects:()=>{setMental(-1);}, next:"next_day"},
    {text:"«А вы не умрёте?»", effects:()=>{setMental(-2);if(Math.random()<.5)state.flags.orphan=false;}, next:"next_day"},
  ]},
orphan_escape: { bg:"street", text:`${fmtDate()}. Ты решил сбежать. Окно на втором этаже.`,
  choices:[
    {text:"Прыгнуть", effects:()=>{if(Math.random()<.7){state.flags.orphan=false;state.flags.orphan_free=true;}else die("fall",state.age);}, next:"next_day"},
    {text:"Остаться", effects:()=>{setMental(-1);}, next:"next_day"},
  ]},

/* ========== ДЕМЕНЦИЯ ========== */
dementia_crisis: { bg:"home", text:`${fmtDate()}. Ты не помнишь, как сюда попал. Комната знакомая, но чужая. На столе — фото. Кто эти люди?`,
  choices:[
    {text:"Позвонить ребёнку", effects:()=>{if(rel("child")>=3)setMental(+1);else setMental(-2);}, next:"next_day"},
    {text:"Выйти на улицу", effects:()=>{if(Math.random()<.3)die("lost",state.age);setMental(-2);}, next:"next_day"},
    {text:"Сесть и ждать", effects:()=>{setMental(-1);}, next:"next_day"},
  ]},
dementia_aggression: { bg:"home", text:`${fmtDate()}. Кто-то трогает твои вещи. Ты не помнишь, кто. Но он — враг.`,
  choices:[
    {text:"Ударить", effects:()=>{state.karma-=5;if(Math.random()<.3)state.flags.killed_someone=true;}, next:"next_day"},
    {text:"Крикнуть", effects:()=>{setMental(-2);}, next:"next_day"},
    {text:"Спрятаться", effects:()=>{setMental(-1);}, next:"next_day"},
  ]},

/* ========== ПСИХУШКА ========== */
psych_ward: { bg:"psych", text:`${fmtDate()}. Тебя забрали. Белые стены, решётки. Врач: «Мы поможем тебе забыть».`,
  choices:[
    {text:"Сотрудничать", effects:()=>{setMental(-2);}, next:"next_day",

    {text:"Притвориться здоровым", effects:()=>{if(state.mental>=4){setMental(+2);state.flags.psych_ward=false;}else setMental(-2);}, next:"next_day"},
    {text:"Сбежать", effects:()=>{if(state.stamina>7&&Math.random()<.3){state.flags.psych_ward=false;setMental(+1);}else setMental(-3);}, next:"next_day"},
  ]},
psych_ward_loop: { bg:"psych", text:`${fmtDate()}. День в палате. Ты считаешь трещины на потолке.`,
  choices:[
    {text:"Смириться", effects:()=>{}, next:"next_day"},
    {text:"Кричать", effects:()=>{setMental(-1);}, next:"next_day"},
    {text:"Планировать побег", effects:()=>{if(state.stamina>5&&Math.random()<.2){state.flags.psych_ward=false;}else setMental(-1);}, next:"next_day"},
  ]},
psych_kill: { bg:"psych", text:`${fmtDate()}. Тебя ведут на «лечение». Ремни. Холодный укол.`,
  choices:[
    {text:"Кричать", effects:()=>{die("psych_kill",state.age,"персонал");}},
    {text:"Молчать", effects:()=>{die("hospital_kill",state.age,"персонал");}},
    {text:"«Я здоров»", effects:()=>{die("suicide_watch",state.age,"персонал");}},
  ]},
low_mental_glances: { bg:"street", text:`${fmtDate()}. Прохожие смотрят косо.`,
  choices:[
    {text:"Игнорировать", effects:()=>{setMental(-1);}, next:"next_day"},
    {text:"Улыбнуться", effects:()=>{setMental(+1);}, next:"next_day"},
    {text:"Крикнуть", effects:()=>{setMental(-2);state.karma-=3;}, next:"next_day"},
  ]},
low_mental_school: { bg:"school", text:`Учительница: «${state.name}, тебе нужно к врачу».`,
  when:()=>lowMentalActive(),
  choices:[
    {text:"Согласиться", effects:()=>{state.flags.psych_ward=true;}, next:"next_day"},
    {text:"Отказаться", effects:()=>{setMental(-2);}, next:"next_day"},
    {text:"Соврать", effects:()=>{setMental(+1);}, next:"next_day"},
  ]},
low_mental_family: { bg:"home", text:`Мать не смотрит в глаза. «Ты ${g("стал","стала")} другим».`,
  when:()=>lowMentalActive(),
  choices:[
    {text:"Обнять", effects:()=>{setRel("mother",+2);setMental(+1);}, next:"next_day"},
    {text:"Уйти", effects:()=>{setRel("mother",-3);}, next:"next_day"},
    {text:"Наорать", effects:()=>{setRel("mother",-5);setMental(-2);}, next:"next_day"},
  ]},

/* ========== СОБЫТИЯ ========== */
event_anya_revenge: { bg:"corridor_night", text:`${fmtDate()}. Она в конце коридора. В руке — что-то блестящее.`,
  when:()=>rel("anya")<-3&&flag("grudge"),
  choices:[
    {text:"Подойти", effects:()=>{playSfx("glitch");shake();die("anya_stab",state.age,"anya");}},
    {text:"Бежать", effects:()=>{if(state.stamina>5)schedule(12,"anya_revenge");else{playSfx("glitch");shake();die("anya_stab",state.age,"anya");}}, next:"next_day"},
    {text:"Крикнуть", effects:()=>{playSfx("glitch");shake();die("anya_stab",state.age,"anya");}},
  ]},
day_start: { bg:"home", text:`Новый день.`, choices:[{text:"Продолжить", next:"next_day"}]},

};
}

/* ============ ПЛАНИРОВЩИК ============ */
const DAY_POOL = {
  6:  ["home_age6","neutral_dinner","neutral_weather","absurd_chalk_age10","steal_age10"],
  12: ["school_age12","school_bully_age12","lena_neutral_food","lena_neutral_dream",
       "school_corridor_age13","beat_classmate_age13","neutral_weather","neutral_period",
       "neutral_voice","absurd_aliens_age11","school_use_lena","low_mental_glances"],
  16: ["club_age16","forest_age17","school_use_lena","lena_needs_help_age14",
       "lena_protect_serious_age15","push_from_roof_age16","absurd_president_age17","neutral_weather"],
  19: ["uni_age19","love_age20","alcohol_age19","drugs_age20","accident_age22","job_age22"],
  23: ["career_age25","marriage_age28","child_birth_age30","affair_age32","midlife_age40"],
  35: ["family_age35","parents_die_age45","health_age50","friend_die_age55","divorce_age52"],
  50: ["health_age50","dementia_aggression","friend_die_age55","divorce_age52","midlife_age40"],
  65: ["old_age65","old_70","old_75","old_80","old_85","old_90","dementia_crisis"],
};
function getPool(){
  const a = state.age;
  if(a<12) return DAY_POOL[6];
  if(a<16) return DAY_POOL[12];
  if(a<19) return DAY_POOL[16];
  if(a<23) return DAY_POOL[19];
  if(a<35) return DAY_POOL[23];
  if(a<50) return DAY_POOL[35];
  if(a<65) return DAY_POOL[50];
  return DAY_POOL[65];
}

/* ============ ДВИЖОК ============ */
const app = document.getElementById("app");

function shake(){
  const el = document.querySelector(".scene") || app;
  el.classList.add("shake");
  setTimeout(()=>el.classList.remove("shake"),800);
}

function die(cause, atAge, killer=null){
  state.deathCause = DEATHS[cause] || cause;
  state.deathAge = atAge;
  state.killer = killer;
  showDeath();
}

function buildEpilogue(){
  const parts = [`Ты умер в ${state.deathAge} лет.`,`Причина: ${state.deathCause}.`];
  const r = n => state.relations[n] ?? 0;

  if(state.killer && r(state.killer)<=-5) parts.push("Это сделал тот, кого ты когда-то обидел.");
  if(r("mother")>=5) parts.push("Мать не пережила. Она приходила на могилу каждый день.");
  else if(r("mother")<=-3) parts.push("Мать узнала слишком поздно. Она даже не пришла.");
  if(r("anya")>=3) parts.push("Аня пришла на похороны. Она плакала.");
  else if(r("anya")<=-5) parts.push("Аня не пришла. Она знала, что так будет.");
  if(r("lena")>=5) parts.push("Лена была рядом до конца.");
  else if(r("lena")<=-5) parts.push("Лена не пришла. Ты сам её оттолкнул.");
  if(r("child")>=3) parts.push("Твой ребёнок держал тебя за руку.");

  if(state.mental<=2) parts.push("Психика была разрушена задолго до конца.");
  else if(state.mental>=8) parts.push("До последнего дня ты сохранял ясность.");

  if(flag("kind")) parts.push("Кто-то вспомнил, что ты был добр.");
  if(flag("basement_seen")) parts.push("Ты так и не рассказал никому про подвал.");
  if(flag("told_truth")) parts.push("Твой ребёнок узнал правду. И не испугался.");
  if(flag("told_lie")) parts.push("Ты соврал ребёнку так же, как когда-то тебе.");
  if(flag("accepted")) parts.push("Ты улыбнулся. Оно улыбнулось в ответ.");
  if(flag("beat_child")) parts.push("Ты стал тем, кого боялся в детстве.");
  if(flag("pyro")) parts.push("Огонь шёл за тобой всю жизнь.");
  if(flag("psych_ward")) parts.push("Тебя держали в психушке. Ты умер там.");
  if(flag("killed_someone")) parts.push("Ты убил человека. Это осталось с тобой.");
  if(flag("lena_dead")) parts.push("Лена умерла, защищая тебя. Ты не смог её спасти.");
  if(flag("lena_left")) parts.push("Лена отвернулась от тебя. Ты остался один.");
  if(flag("orphan")) parts.push("Ты вырос в детском доме. Никто не пришёл за тобой.");
  if(flag("mother_believes")) parts.push("Мать верила тебе. До конца.");
  if(flag("thingLevel")&&state.thingLevel>=4) parts.push("Оно забрало тебя. Как обещало.");

  if(state.guilt>5) parts.push("Последнее, что ты чувствовал — вина.");
  if(state.fear>10) parts.push("Последнее, что ты чувствовал — страх.");

  const key=[
    state.deathCause,state.deathAge,state.killer||"-",
    flag("kind")?"k":"-",flag("orphan")?"o":"-",
    flag("lena_dead")?"ld":"-",flag("lena_left")?"ll":"-",
    flag("psych_ward")?"pw":"-",flag("killed_someone")?"ks":"-",
    state.mental<=2?"m2":"-",state.mental>=8?"m8":"-",
  ].join("_");
  state.seenEndings.add(key);

  return parts.join(" ");
}

function showDeath(){
  const ep = buildEpilogue();
  playSfx("heartbeat");
  app.classList.add("fade-out");
  setTimeout(()=>{
    app.innerHTML=`
      <div class="death-screen">
        <p>${ep}</p>
        <p class="counter">Концовка: ${state.seenEndings.size} · Возраст: ${state.deathAge} · ${fmtDate()}</p>
        <button id="restart">Начать заново</button>
      </div>`;
    document.getElementById("restart").onclick=()=>location.reload();
    app.classList.remove("fade-out");
  },350);
}

function playScene(id){
  if(id==="next_day"||id==="auto_day") return advanceMonth();
  const scene = scenes[id];
  if(!scene) return console.error("Нет сцены:",id);

  const due = checkTimers();
  if(due.length && !id.startsWith("event_")) return playScene("event_"+due[0].event);

  if(scene.when && !scene.when()) return playScene("next_day");

  // психушка после убийства
  if(flag("killed_someone") && !flag("psych_ward") && !flag("psych_checked") && !flag("psych_escaped") && !flag("psych_faked") && !flag("psych_kill_done")){
    state.flags.psych_checked = true;
    state.flags.psych_ward = true;
    state.flags.psych_start_day = state.day;
    setMental(-5);
    return playScene("psych_ward");
  }

  // детдом
  if(flag("orphan") && !flag("orphan_done") && !id.startsWith("orphan_") && !id.startsWith("thing_")){
    state.flags.orphan_done = true;
    return playScene("orphan_home");
  }

  render(scene);
}

function render(scene){
  app.classList.add("fade-out");
  setTimeout(()=>{
    const mentClass = state.mental<=2 ? "low" : "";
    app.innerHTML=`
      <div class="scene">
        <div class="scene-inner">
          <div class="status">
            <span>${state.name}</span>
            <span>${fmtDate()} · ${state.age} ${state.age<5?"года":"лет"}</span>
            <span class="${mentClass}">Психика: ${starStr(state.mental)}</span>
          </div>
          <p class="text">${scene.text}</p>
          <div class="choices"></div>
        </div>
      </div>`;
    const sceneEl = app.querySelector(".scene");
    sceneEl.style.background = BG[scene.bg] || BG.home;

    const box = app.querySelector(".choices");
    if(scene.choices){
      scene.choices.forEach(c=>{
        const b = document.createElement("button");
        b.textContent = c.text;
        b.onclick = ()=>{
          getCtx();
          c.effects?.();
          if(state.deathCause) return;
          if(c.after){
            showAfter(c.after, c.next || "next_day");
            return;
          }
          playScene(c.next || "next_day");
        };
        box.appendChild(b);
      });
    } else {
      const b = document.createElement("button");
      b.textContent = "Дальше";
      b.onclick = ()=>{getCtx();playScene(scene.next||"next_day");};
      box.appendChild(b);
    }
    app.classList.remove("fade-out");
  },350);
}

function showAfter(text, next){
  app.classList.add("fade-out");
  setTimeout(()=>{
    app.innerHTML = `
      <div class="scene">
        <div class="scene-inner">
          <div class="status">
            <span>${state.name}</span>
            <span>${fmtDate()} · ${state.age} ${state.age<5?"года":"лет"}</span>
            <span class="${state.mental<=2?"low":""}">Психика: ${starStr(state.mental)}</span>
          </div>
          <p class="text after-text">${text}</p>
          <div class="choices"><button id="contBtn">Дальше</button></div>
        </div>
      </div>`;
    document.getElementById("contBtn").onclick = ()=>{
      app.classList.remove("fade-out");
      playScene(next);
    };
    app.classList.remove("fade-out");
  },350);
}

function advanceMonth(){
  // сдвиг месяца
  state.m += 1;
  if(state.m > 12){ state.m = 1; state.y += 1; }
  state.day += 1;

  // психика
  if(flag("killed_someone")) setMental(-1);
  if(state.fear>8) setMental(-1);
  if(state.guilt>8) setMental(-1);

  // день рождения (переход ноябрь→декабрь, отмечен флагом)
  if(state.m === 12){
    if(!state.flags.birthday_done){
      state.flags.birthday_done = true;
      state.age += 1;
      if(state.age < 12) return playScene("birthday");
      if(state.age < 19) return playScene("birthday_teen");
      if(state.age < 65) return playScene("birthday_adult");
      return playScene("birthday_old");
    }
  } else {
    state.flags.birthday_done = false;
  }

  // деменция с 50
  if(state.age >= 50){
    state.dementia = Math.min(10, state.dementia + (Math.random()<.3?1:0));
    if(Math.random()<.4){
      const delta = Math.random()<.6 ? -(1+Math.floor(Math.random()*3)) : +(1+Math.floor(Math.random()*2));
      setMental(delta);
    }
    if(state.dementia >= 8 && Math.random() < .25){
      return playScene("dementia_crisis");
    }
  }

  // сущность: раз в 2–5 месяцев, до 18 лет
  if(state.age < 18 && state.thingLevel < 5 && !flag("orphan") && !flag("psych_ward")){
    if(state.day >= state.thingNextMonth){
      state.thingNextMonth = state.day + 2 + Math.floor(Math.random()*4);
      state.thingLevel += 1;
      return playScene("thing_event_" + state.thingLevel);
    }
  }

  autoDay();
}

function autoDay(){
  // психушка
  if(flag("psych_ward") && !flag("psych_kill_done")){
    const startDay = state.flags.psych_start_day || state.day;
    if(state.day >= startDay + 12){
      state.flags.psych_kill_done = true;
      return playScene("psych_kill");
    }
    return playScene("psych_ward_loop");
  }

  // детдом
  if(flag("orphan") && !flag("orphan_done")){
    state.flags.orphan_done = true;
    return playScene("orphan_home");
  }
  if(flag("orphan") && Math.random() < .5){
    const orphanPool = ["orphan_bully","orphan_caretaker","orphan_adoption","orphan_escape"];
    return playScene(pickScene(orphanPool));
  }

  // месть Ани
  if(flag("grudge") && rel("anya")<-3 && state.age>=16 && state.age<45 && !flag("revenge_done")){
    state.flags.revenge_done = true;
    return playScene("event_anya_revenge");
  }

  // кома
  if(state.age===23 && !flag("coma_done")){state.flags.coma_done=true;return playScene("coma_age23");}

  // возвращение в школу
  if(state.age===45 && flag("grudge") && rel("anya")<-3 && !flag("return_done")){
    state.flags.return_done=true; return playScene("return_age45");
  }

  // старость
  if(state.age>=65){
    if(!flag("old_done")){state.flags.old_done=true;return playScene("old_age65");}
    return playScene("old_age_loop");
  }

  // низкая психика
  if(lowMentalActive() && !flag("low_mental_seen") && Math.random()<.4){
    state.flags.low_mental_seen = true;
    return playScene("low_mental_glances");
  }

  // обычный день
  playScene(pickScene(getPool()));
}

/* ============ СТАРТ ============ */
function startScreen(){
  app.classList.remove("fade-out");
  app.innerHTML = `
    <div class="scene">
      <div class="scene-inner">
        <div class="status"><span>Новая жизнь · ${fmtDate()}</span></div>
        <p class="text">Как тебя зовут?</p>
        <input id="nameInput" class="name-input" maxlength="20" placeholder="Имя" autocomplete="off">
        <div class="choices"><button id="btnOk">Дальше</button></div>
      </div>
    </div>`;
  const input = document.getElementById("nameInput");
  input.focus();
  const go = () => {
    const v = input.value.trim();
    if(v.length < 1){ input.placeholder = "Введи имя"; input.focus(); return; }
    state.name = v;
    genderScreen();
  };
  document.getElementById("btnOk").onclick = go;
  input.onkeydown = e => { if(e.key === "Enter") go(); };
}

function genderScreen(){
  app.innerHTML = `
    <div class="scene">
      <div class="scene-inner">
        <div class="status"><span>Имя: ${state.name}</span></div>
        <p class="text">Ты девочка или мальчик?</p>
        <div class="choices">
          <button data-g="girl">Девочка</button>
          <button data-g="boy">Мальчик</button>
        </div>
      </div>
    </div>`;
  document.querySelectorAll("[data-g]").forEach(b=>{
    b.onclick = ()=>{
      state.gender = b.dataset.g;
      scenes = initScenes();
      state.flags.birthday_done = true; // день рождения только что был (28.11.2015)
      playScene("home_age6");
    };
  });
}

startScreen();
</script>
