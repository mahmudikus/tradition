  body{margin:0;background:#0a0a0a;color:#ddd;font-family:'Courier New',monospace;min-height:100vh}

  #app.fade-out{opacity:0}
  .scene{position:relative;min-height:100vh;padding:4rem 2rem;background:#111 center/cover no-repeat;animation:fadeIn .5s ease}
  .scene::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:0}
  .scene>*{position:relative;z-index:1}
  .scene-inner{max-width:720px;margin:0 auto}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

  .status .low{color:#c33}
  .choices button{display:block;width:100%;margin:.5rem 0;padding:.85rem 1.1rem;background:rgba(20,20,20,.85);color:#eee;border:1px solid #333;cursor:pointer;font-family:inherit;font-size:1rem;text-align:left;transition:background .2s,transform .1s,border-color .2s}

  .name-input{width:100%;padding:.8rem 1rem;background:rgba(20,20,20,.85);color:#eee;border:1px solid #333;font-family:inherit;font-size:1.1rem;margin-bottom:1rem}
  .name-input:focus{outline:none;border-color:#666}
  .death-screen{min-height:100vh;padding:6rem 2rem;text-align:center;max-width:720px;margin:0 auto;animation:fadeIn .6s ease;display:flex;flex-direction:column;justify-content:center}

  @keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-6px,3px)}50%{transform:translate(6px,-3px)}75%{transform:translate(-3px,-3px)}}

const MONTHS = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];

const rel  = n => state.relations[n] ?? 0;
const setRel = (n,d) => { state.relations[n] = Math.max(-10,Math.min(10,rel(n)+d)); };
const setMental = d => { state.mental = Math.max(1,Math.min(10,state.mental+d)); };
const schedule = (days,event) => state.timers.push({day:state.day+days,event});
const checkTimers = () => {
  const due = state.timers.filter(t=>t.day<=state.day);
  state.timers = state.timers.filter(t=>t.day>state.day);
  return due;
};

const lowMentalActive = () => state.mental <= 2;

const pickScene = pool => {
  const avail = pool.filter(s => !state.recentScenes.includes(s));
  const src = avail.length ? avail : pool;
  const pick = src[Math.floor(Math.random()*src.length)];
  state.recentScenes.push(pick);
  if(state.recentScenes.length > 6) state.recentScenes.shift();
  return pick;
};

/* ============ ЛЕНА/САША ============ */
function lenaProtect(){
  state.flags.lena_protect_count = (state.flags.lena_protect_count||0) + 1;
  setRel("lena", +1);
  if (state.flags.lena_protect_count >= 4 && !flag("lena_dead")) {
    state.flags.lena_dead = true;
    return "lena_death";
  }
  return null;
}
function lenaUse(){
  state.flags.lena_used_count = (state.flags.lena_used_count||0) + 1;
  setRel("lena", -2);
  if (state.flags.lena_used_count >= 3 && !flag("lena_left")) {
    state.flags.lena_left = true;
    return "lena_leaves";
  }
  return null;
}

/* ============ ЗВУК ============ */
let audioCtx=null;
const getCtx=()=>audioCtx||(audioCtx=new (window.AudioContext||window.webkitAudioContext)());
function playSfx(name){
  try{
    const ctx=getCtx();
    if(ctx.state==="suspended")ctx.resume();
    if(name==="glitch"){
      const dur=.25,buf=ctx.createBuffer(1,ctx.sampleRate*dur,ctx.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
      const s=ctx.createBufferSource();s.buffer=buf;
      const gn=ctx.createGain();
      gn.gain.setValueAtTime(.4,ctx.currentTime);
      gn.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);
      s.connect(gn).connect(ctx.destination);s.start();
    }
    if(name==="heartbeat"){
      const beat=(t,f,v)=>{const o=ctx.createOscillator(),gn=ctx.createGain();
        o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.5,t+.15);
        gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+.2);
        o.connect(gn).connect(ctx.destination);o.start(t);o.stop(t+.25);
      };
      const n=ctx.currentTime;beat(n,90,.5);beat(n+.25,70,.35);
    }
  }catch(e){}
}

const QUESTIONS = [

function buildTeacherScene(){
  const q = QUESTIONS[Math.floor(Math.random()*QUESTIONS.length)];
  const answers = [q.correct, ...q.wrong].sort(()=>Math.random()-0.5);
  return {
    bg:"school",
    text:`Марина Павловна стучит указкой по доске. В классе двадцать три человека. Все смотрят в журнал.\n\n«${state.name}», — говорит она, не поднимая глаз. «К доске».\n\nКласс затихает. Кто-то хихикает. У тебя потеют ладони. Вопрос по ${q.subject}: ${q.q}`,
    choices: answers.map(a => ({
      text: a,
      effects: ()=>{
        if(a === q.correct){ setMental(+1); setRel("teacher", +1); }
        else { setMental(-2); state.guilt += 1; }
      },
      next: a === q.correct ? "teacher_correct" : "teacher_wrong",
    }))
  };
}

     after:`Ты садишься рядом. Молча. Смотришь в окно. За окном — тополь, роняет листья.\n\n${F()} что-то рисует в тетради. Через минуту пододвигает к тебе — это смешная рожица с усами, похожая на Марину Павловну. Ты прыскаешь.`},
  ]},

first_day_after: { bg:"school", text:`Последний урок закончился. Дети вываливаются из класса с криками.\n\n${F()} ждёт тебя у скамейки, где вы познакомились. Рюкзак у ${fE()} ног, ${fHair()} растрёпаны.\n\n«Ну что, — говорит ${fHe()}, — ты как? Первый день — самый страшный. Дальше легче».`,
  choices:[
    {text:"«Спасибо, что помог${fA()}»", effects:()=>{setRel("lena",+2);}, next:"next_day", after:`${fHeCap()} машет рукой. «Да ладно. Мне скучно было, а тут ты».\n\nВы расходитесь. Дома мать спросит, как всё прошло. Ты скажешь: «Нормально». И впервые за долгое время это будет правда.`},
    {text:"«Как тебя зовут?»", next:"next_day", after:`${fHeCap()} закатывает глаза. «${F()}. Я тебе уже говорил${fA()}. Ты забыл${g("","а")}?»\n\nТы краснеешь. ${fHeCap()} смеётся, легко, необидно. «Ладно. Я тоже забываю. У меня память как у рыбки».`},
    {text:"«А ты всегда тут сидишь?»", next:"next_day", after:`${fHeCap()} кивает. «Каждый день. С первого класса. Тут хорошее место — видно всех, а тебя не видно».\n\nТы задумываешься над этим. Дома весь вечер ты думаешь об этом.`},
  ]},

first_day_alone: { bg:"school", text:`Ты идёшь по коридору один. Урок уже начался.\n\nПрисаживаешься на подоконник. Так проходит час. Потом ещё один. Тебя находят.`,
  next:"next_day"},

/* ========== ДОМ, ПОДВАЛ ========== */
home_age6: { bg:"home", text:`${fmtDate()}.\n\nТебе шесть. Мать на кухне — слышно, как гремит посудой. Отец не вернулся с работы — третий вечер подряд.\n\nИз подвала доносится шорох. Будто кто-то перебирает старые вещи. Но в подвале нет вещей — только пустые полки и мокрое пятно на полу, которое никогда не высыхает.`,
  choices:[
    {text:"Пойти в подвал", effects:()=>{state.fear+=2;state.flags.basement_seen=true;}, next:"basement_age6",
     after:`Скрип ступеней — вторая сверху всегда скрипит громче. Света нет. Шорох прекращается, как только ты делаешь шаг.\n\nТеперь тишина стала громче.`},
    {text:"Спрятаться под одеяло", effects:()=>{state.fear+=1;setRel("mother",+1);}, next:"home_night_age6",
     after:`Забираешься под одеяло с головой. Шорох не прекращается. Он будто подстраивается под дыхание.\n\nТы засыпаешь под него.`},
    {text:"Позвать мать", effects:()=>{setRel("mother",+2);}, next:"mother_kitchen_age6",
     after:`Ты идёшь на кухню. Мать оборачивается — руки в муке, глаза уставшие, улыбка натянутая.\n\n«Что, милый?»`},
  ]},

basement_age6: { bg:"basement", text:`Темно. Пахнет сыростью и чем-то ещё — сладковатым, как испорченное варенье.\n\nЧто-то шевелится в углу. Ты не можешь разглядеть.`,
  choices:[
    {text:"Подойти ближе", effects:()=>{state.fear+=4;}, next:"basement_thing_age6", after:`Ты делаешь шаг. Потом ещё. Пол холодный даже через носки.`},
    {text:"Бежать наверх", effects:()=>{state.fear+=1;}, next:"home_night_age6"},
    {text:"Замереть", effects:()=>{state.fear+=2;}, next:"basement_wait"},
  ]},

basement_wait: { bg:"basement", text:`Ты стоишь. Не дышишь. Шорох стихает.\n\nИ тогда ты слышишь голос — тихий, детский. Свой собственный, но будто из другой комнаты.\n\n«Не уходи. Мне скучно».`,
  choices:[
    {text:"«Кто ты?»", effects:()=>{state.fear+=3;}, next:"basement_answer_age6"},
    {text:"Убежать", effects:()=>{setMental(-1);}, next:"home_night_age6"},
  ]},

basement_thing_age6: { bg:"basement", text:`Оно смотрит. У него нет лица — но ты знаешь: оно улыбается.\n\nКак ты это знаешь? Ты не можешь объяснить.`,
  choices:[
    {text:"Спросить «кто ты?»", effects:()=>{state.fear+=5;}, next:"basement_answer_age6", after:`Ты шепчешь. Оно отвечает.`},
    {text:"Ударить", effects:()=>{state.karma-=3;die("thing_take",6);}},
    {text:"Обнять", effects:()=>{state.flags.hugged_it=true;setMental(-3);}, next:"next_day",
     after:`Ты обнимаешь. Оно холодное. Как лёд. Ты не понимаешь, зачем это делаешь.`},
  ]},

basement_answer_age6: { bg:"basement", text:`«Я — то, что останется, когда все уйдут».\n\nГолос тихий. Спокойный. Как будто говорит о погоде.`,
  next:"home_night_age6"},

mother_kitchen_age6: { bg:"home", text:`Мать обнимает. От неё пахнет мукой и потом.\n\n«Всё хорошо, милый». Она врёт. Ты чувствуешь это. Но не говоришь.`,
  choices:[
    {text:"Поверить", effects:()=>{setRel("mother",+2);}, next:"home_night_age6"},
    {text:"Спросить про подвал", effects:()=>{state.fear+=2;setRel("mother",-1);}, next:"mother_lies_age6",
     after:`Ты спрашиваешь. Она отворачивается к раковине.`},
  ]},

mother_lies_age6: { bg:"home", text:`«Там ничего нет». Её руки дрожат над раковиной. Она моет одну и ту же тарелку третий раз.`,
  next:"home_night_age6"},

home_night_age6: { bg:"home", text:`Ночь. Ты не спишь. Слышишь шаги на лестнице — медленные, тяжёлые.`,
  choices:[
    {text:"Выйти в коридор", effects:()=>{state.fear+=3;}, next:"stairs_age6"},
    {text:"Закрыть глаза", effects:()=>{state.fear+=1;}, next:"next_day"},
  ]},

stairs_age6: { bg:"home", text:`На лестнице никого. Но на верхней ступеньке — мокрый след. Босой. Маленький. Как у ребёнка.`,
  next:"next_day"},

/* ========== СУЩНОСТЬ ========== */
thing_event_1: { bg:"home", text:`Прошло несколько месяцев. ${fmtDate()}.\n\nНочью просыпаешься от холода. Одеяло сброшено на пол. В углу комнаты — тень. Слишком густая. Не как от шкафа.`,
  choices:[
    {text:"Смотреть", effects:()=>{state.fear+=3;}, next:"next_day",
     after:`Тень не двигается. Но ты чувствуешь: она смотрит в ответ.\n\nУтром на полу — мокрый след, ведущий к двери подвала.`},
    {text:"Закрыть глаза", effects:()=>{setMental(-1);}, next:"next_day"},
    {text:"Позвать мать", effects:()=>{setRel("mother",+1);}, next:"thing_warn_1"},
  ]},

thing_warn_1: { bg:"home", text:`Мать приходит, включает свет. Она в халате, волосы растрёпаны.\n\nСадится на край кровати. «Что ты видел${g("","а")}?»`,
  choices:[
    {text:"Рассказать правду", effects:()=>{setRel("mother",+1);}, next:"next_day",
     after:`Ты рассказываешь — про тень, про холод, про след.\n\nОна молчит. Долго. Потом говорит: «Не говори отцу. Он не поймёт». И уходит, закрыв за собой дверь неплотно.`},
    {text:"Соврать", effects:()=>{setRel("mother",-1);}, next:"next_day"},
  ]},

thing_event_2: { bg:"home", text:`Ещё через полгода. ${fmtDate()}.\n\nТы находишь в подвале старую фотографию — в углу за полкой, затянутую паутиной. На ней — семья. Не твоя. У всех стёрты лица, будто кто-то долго тёр их пальцем.`,
  choices:[
    {text:"Взять себе", effects:()=>{state.fear+=2;}, next:"next_day",
     after:`Прячешь под матрас. Ночью фото оказывается на подушке — лицом вверх.\n\nТы не брал${g("","а")} его.`},
    {text:"Показать матери", next:"thing_warn_2",
     after:`Мать берёт фото. Долго смотрит — слишком долго. Потом бросает в огонь на плите.\n\n«Не трогай больше ничего в подвале». Голос не дрожит. Но руки — да.`},
    {text:"Сжечь самому", effects:()=>{state.fear-=1;}, next:"next_day"},
  ]},

thing_warn_2: { bg:"home", text:`Мать стоит у окна. За стеклом — сумерки, фонарь, кто-то идёт по улице.\n\n«Ты давно видишь… его?» — спрашивает она, не оборачиваясь.`,
  choices:[
    {text:"«Да. С шести лет»", effects:()=>{state.flags.mother_believes=true;}, next:"next_day",
     after:`Она оборачивается. В её глазах страх — не за себя.\n\nЗа тебя. «Я знала. Я надеялась, оно выберет меня».`},
    {text:"«Нет. Просто фото»", next:"next_day",
     after:`Она выдыхает. Ты видишь, как напряжение уходит из её плеч.\n\nТы только что остал${g("ся","ась")} один${g("","а")}.`},
  ]},

thing_event_3: { bg:"basement", text:`Проходит почти год. ${fmtDate()}.\n\nТы спускаешься в подвал за банкой варенья. На стене — новая надпись. Свежая краска, капает на пол.\n\n«ОН РАСТЁТ».`,
  choices:[
    {text:"Сфотографировать", next:"next_day",
     after:`Ты щёлкаешь телефоном. На снимке — пустая стена. Надпись видна только глазами.`},
    {text:"Показать отцу", effects:()=>{setRel("father",-1);}, next:"thing_warn_father",
     after:`Отец спускается. Смотрит на стену. Долго. Потом трогает краску пальцем, нюхает.\n\n«Какая надпись? Тут ничего нет». Уходит. Ты стоишь перед пустой стеной.`},
    {text:"Стереть", effects:()=>{state.fear+=2;}, next:"next_day",
     after:`Ты трёшь её рукавом. Краска не стирается.\n\nУтром надпись другая: «ТЫ ТОЖЕ».`},
  ]},

thing_warn_father: { bg:"home", text:`Отец сидит на кухне. Перед ним — стакан, наполовину пустой. Смотрит на тебя.\n\n«Мать говорит, ты видишь вещи».`,
  choices:[
    {text:"Рассказать всё", effects:()=>{if(flag("mother_believes"))state.flags.father_believes=true;}, next:"next_day",
     after:`Ты рассказываешь — про подвал, про тень, про надписи.\n\nОн долго молчит. Потом: «Завтра я спущусь сам». Он не спускается. Никогда.`},
    {text:"Отпереться", effects:()=>{setRel("father",-2);}, next:"next_day"},
  ]},

thing_event_4: { bg:"home", text:`${fmtDate()}.\n\nНочью слышишь крик. Мать стоит в коридоре. Перед ней — дверь подвала. Открытая.\n\nОна не двигается. Смотрит внутрь.`,
  choices:[
    {text:"Закрыть дверь", effects:()=>{state.fear+=3;setRel("mother",+2);}, next:"next_day",
     after:`Ты захлопываешь дверь. Мать приходит в себя. «Спасибо», — шепчет она.\n\nБольше она не смеётся над «тенью».`},
    {text:"Заглянуть внутрь", effects:()=>{state.fear+=5;setMental(-2);}, next:"thing_face",
     after:`В темноте — глаза. Не два. Больше. Смотрят снизу вверх, как ребёнок на родителя.`},
    {text:"Разбудить отца", effects:()=>{}, next:"next_day",
     after:`Отец ворчит, но идёт. Закрывает дверь. Утром замок сломан.`},
  ]},

thing_face: { bg:"basement", text:`Не тень. Существо. Сидит на нижней ступеньке.\n\nУ него твоё лицо — но взрослое.`,
  choices:[
    {text:"«Что тебе надо?»", effects:()=>{state.fear+=3;}, next:"thing_answer"},
    {text:"Убежать", effects:()=>{setMental(-2);}, next:"next_day"},
  ]},

thing_answer: { bg:"basement", text:`«Тебя. Когда останешься один${g("","а")}. Твои родители… они мешают».`,
  choices:[
    {text:"«Не тронь их»", effects:()=>{state.fear+=2;}, next:"next_day",
     after:`«Тогда защити их. Если сможешь». Оно исчезает.\n\nТы больше не запираешь дверь.`},
    {text:"Молчать", effects:()=>{setMental(-3);}, next:"next_day"},
  ]},

thing_event_5: { bg:"home", text:`${fmtDate()}.\n\nПросыпаешься от тишины. Слишком тихо.\n\nДом пустой. Мать и отец не вернулись. Их вещи на месте.`,
  choices:[
    {text:"Искать их", effects:()=>{state.fear+=5;}, next:"thing_parents_gone",
     after:`Ищешь везде. В подвале — открытая дверь.\n\nВнутри — два силуэта в углу. Слишком тихие.`},
    {text:"Позвонить в полицию", effects:()=>{state.flags.orphan=true;}, next:"orphan_home",
     after:`Полиция приезжает. Ничего не находят.\n\nТебя забирают в детский дом.`},
  ]},

thing_parents_gone: { bg:"basement", text:`Два тела. Мать и отец. Держатся за руки.\n\nНа стене надпись: «ТЕПЕРЬ ТЫ СВОБОДЕН».`,
  choices:[
    {text:"Крикнуть", effects:()=>{state.flags.orphan=true;setMental(-5);}, next:"orphan_home",
     after:`Ты кричишь. Никто не приходит.\n\nК утру соседи вызывают полицию.`},
    {text:"Взять что-то на память", effects:()=>{state.flags.orphan=true;setMental(-3);}, next:"orphan_home",
     after:`Ты берёшь мамино кольцо. Оно холодное.\n\nТебя забирают. Ты не плачешь.`},
  ]},

thing_beg_move: { bg:"home", text:`${fmtDate()}.\n\nТы стоишь в дверях кухни. Мать чистит картошку, отец читает газету. Обычный вечер.\n\nТы набираешь воздуха. «Давайте переедем. На соседнюю улицу. Пожалуйста».`,
  when:()=>state.thingLevel >= 3 && !flag("moved"),
  choices:[
    {text:"Рассказать всё", effects:()=>{
      if(flag("mother_believes") && (flag("father_believes") || state.thingLevel >= 4)){
        state.flags.moved = true;
        setRel("mother", +3); setRel("father", +2);
        return "moved_success";
      } else {
        state.flags.moveAttempts = (state.flags.moveAttempts||0) + 1;
        setRel("father", -2);
        return "thing_move_refused";
      }
    }},
    {text:"Просто попросить", effects:()=>{setRel("father",-1);state.flags.moveAttempts=(state.flags.moveAttempts||0)+1;}, next:"thing_move_refused",
     after:`«Просто так. Хочу». Отец поднимает глаза. «С чего вдруг?» Ты не отвечаешь.`},
    {text:"Промолчать", effects:()=>{}, next:"next_day"},
  ]},

thing_move_refused: { bg:"home", text:`Отец откладывает газету. Смотрит на тебя — не зло, устало.\n\n«${state.name}. У нас нет денег на переезд. И даже если бы были — с чего вдруг? Из-за твоих фантазий?»\n\nМать молчит. Она всегда молчит, когда он так говорит.`,
  choices:[
    {text:"Настаивать", effects:()=>{setRel("father",-2);setMental(-1);}, next:"next_day",
     after:`Ты настаиваешь. Отец повышает голос. Мать уходит в комнату.\n\nНочью ты слышишь, как они ругаются. Из-за тебя.`},
    {text:"Уйти", effects:()=>{setMental(-1);}, next:"next_day"},
  ]},

moved_success: { bg:"street", text:`${fmtDate()}.\n\nЧерез две недели вы переезжаете. Соседняя улица, старый дом, но другой. Светлее.\n\nПервую ночь ты спишь без снов. Впервые за много лет.`,
  choices:[
    {text:"Осмотреться", next:"next_day",
     after:`Ты обходишь дом. Нет подвала — только кладовка, сухая и тёплая.\n\nТы стоишь в ней минуту. Слушаешь. Ничего.`},
    {text:"Поблагодарить мать", effects:()=>{setRel("mother",+2);}, next:"next_day",
     after:`Ты обнимаешь её. Она гладит тебя по голове. «Всё, милый. Всё».`},
  ]},

/* ========== ДЕТДОМ ========== */
orphan_home: { bg:"orphanage", text:`${fmtDate()}. Тебе ${state.age}.\n\nДетский дом. Восемь детей в комнате. Воспитательница: «${state.name}, вот твоя койка».`,
  choices:[
    {text:"Лечь", effects:()=>{setMental(-1);}, next:"next_day"},
    {text:"Осмотреться", effects:()=>{state.fear+=1;}, next:"next_day"},
  ]},

orphan_bully: { bg:"orphanage", text:`${fmtDate()}. Старшие заперли тебя в чулане. «Посиди, пока не заплачешь».`,
  choices:[
    {text:"Плакать", effects:()=>{setMental(-2);}, next:"next_day"},
    {text:"Молчать", effects:()=>{setMental(-1);}, next:"next_day"},
    {text:"Сломать дверь", effects:()=>{if(state.stamina>6)state.stamina-=3;else die("beaten",state.age);}, next:"next_day"},
  ]},

orphan_adoption: { bg:"orphanage", text:`${fmtDate()}. Приехала пара. Взгляд останавливается на тебе. «Этот${g("","ая")}?»`,
  choices:[
    {text:"Улыбнуться", effects:()=>{state.flags.orphan=false;setMental(+2);}, next:"next_day",
     after:`Ты улыбаешься. Через неделю уезжаешь. В новую жизнь.`},
    {text:"Отвернуться", effects:()=>{setMental(-1);}, next:"next_day"},
    {text:"«А вы не умрёте?»", effects:()=>{setMental(-2);if(Math.random()<.5)state.flags.orphan=false;}, next:"next_day"},
  ]},

/* ========== УЧИТЕЛЬНИЦА ========== */
teacher_correct: { bg:"school", text:`Марина Павловна кивает. «Правильно. Садись». Класс молчит.\n\nКто-то смотрит с уважением. Ты возвращаешься на место. ${F()} шепчет: «Молодец».`,
  choices:[
    {text:`Улыбнуться ${F()}`, effects:()=>{setRel("lena",+1);}, next:"next_day"},
    {text:"Сесть молча", effects:()=>{}, next:"next_day"},
  ]},

teacher_wrong: { bg:"school", text:`Класс взрывается смехом.\n\n«Двоечник!» — кричит Дима с задней парты. Учительница стучит указкой: «Тихо!» Но смех ещё звенит в ушах.\n\nТы возвращаешься на место. ${F()} смотрит в пол.`,
  choices:[
    {text:"Сесть молча", effects:()=>{setMental(-1);}, next:"next_day"},
    {text:"Крикнуть на класс", effects:()=>{setMental(-1);state.karma-=2;}, next:"next_day",
     after:`Ты кричишь. Смех стихает. Дима поднимает брови: «Псих».\n\nСлово повисает в воздухе.`},
    {text:"Улыбнуться", effects:()=>{setMental(+1);}, next:"next_day",
     after:`Ты улыбаешься. Искренне. Смех стихает. Кто-то говорит: «Странный ${g("он","она")}».\n\nНо больше не смеются.`},
  ]},

/* ========== НОВЫЕ ПЕРСОНАЖИ ========== */
neighbor_bab_valya: { bg:"neighbor", text:`${fmtDate()}.\n\nТы возвращаешься из школы. У подъезда сидит соседка — баба Валя. Старая, в платке, с клюкой.\n\nОна смотрит на тебя долго. Потом машет рукой: «Подойди».`,
  when:()=>state.age>=7 && state.age<=14 && !flag("bab_valya_met") && !flag("orphan") && !flag("moved"),
  choices:[
    {text:"Подойти", effects:()=>{state.flags.bab_valya_met=true;}, next:"bab_valya_talk",
     after:`Ты подходишь. Она пахнет валидолом и старым деревом.`},
    {text:"Пройти мимо", effects:()=>{}, next:"next_day"},
  ]},

bab_valya_talk: { bg:"neighbor", text:`Она берёт тебя за руку. Её пальцы сухие, как бумага.\n\n«Ты из квартиры четырнадцать? Из той, где подвал?» Ты киваешь. Она вздыхает.\n\n«Я тут живу шестьдесят лет. До вас там жила семья. Тоже с ребёнком. Мальчик был. Хороший. А потом…» Она замолкает.`,
  choices:[
    {text:"«Что потом?»", effects:()=>{state.fear+=2;}, next:"bab_valya_warning",
     after:`Она долго смотрит в сторону. «А потом они съехали. Втроём не съехали, а вдвоём. Мальчика не стало».\n\nОна замолкает. Больше ничего не говорит.`},
    {text:"«Не хочу знать»", effects:()=>{setMental(-1);}, next:"next_day",
     after:`Она кивает. «Правильно. Не хочешь — не слушай».\n\nНо с этого дня ты думаешь об этом каждый раз, проходя мимо её подъезда.`},
  ]},

bab_valya_warning: { bg:"neighbor", text:`Она наклоняется ближе. Голос шёпотом.\n\n«Если услышишь его — не отвечай. Не зови. И матери скажи, чтоб съезжали. Пока не поздно».`,
  next:"next_day"},

dima_bully: { bg:"school", text:`${fmtDate()}.\n\nДима — самый высокий в классе. Он подходит к твоей парте на перемене, кладёт ладонь на твой учебник.\n\n«${g("Новенький","Новенькая")}. Ты чё так${g("ой","ая")} тих${g("ой","ая")}?»`,
  when:()=>state.age>=7 && state.age<=14 && !flag("dima_met"),
  choices:[
    {text:"Молчать", effects:()=>{setMental(-1);state.flags.dima_met=true;}, next:"next_day",
     after:`Ты молчишь. Он смеётся, забирает учебник, уходит.\n\n${F()} смотрит на тебя. Ничего не говорит.`},
    {text:"«Отойди»", effects:()=>{state.flags.dima_met=true;state.karma-=1;}, next:"dima_fight",
     after:`Ты говоришь это тихо, но твёрдо. Он поднимает брови. «Чё?»`},
    {text:`Позвать ${F()}`, effects:()=>{state.flags.dima_met=true;if(flag("lena_friend"))setRel("lena",+1);}, next:"next_day",
     after:`Ты оборачиваешься. «${F()}». ${fHeCap()} уже встаёт.\n\nДима смотрит на ${fE()} — и почему-то отходит.`},
  ]},

dima_fight: { bg:"school", text:`Он толкает тебя в плечо. Не сильно — проверяет.\n\n«Чё сказал${g("","а")}?»`,
  choices:[
    {text:"Толкнуть в ответ", effects:()=>{state.karma-=3;if(state.stamina>5)state.stamina-=2;else die("beaten",state.age);}, next:"next_day",
     after:`Ты толкаешь. Он падает на парту. Класс ахает.\n\nМарина Павловна входит в этот момент. Тебя ведут к директору.`},
    {text:"Отступить", effects:()=>{setMental(-1);}, next:"next_day"},
  ]},

/* ========== ШКОЛА 11–14 ========== */
school_age12: { bg:"school", text:`${fmtDate()}.\n\nТебе двенадцать. Пятый класс. Новый классный руководитель, новые предметы. И Аня — тихая девочка с длинными волосами. Она сидит одна у окна. Её никто не любит. Ты не знаешь почему.\n\nМарина Павловна смотрит выжидающе: куда сядешь?`,
  choices:[
    {text:"Сесть с Аней", effects:()=>{setRel("anya",+2);}, next:"school_anya_friend",
     after:`Аня удивлённо поднимает брови. «Ты уверен${g("","а")}?» — шёпотом. Ты киваешь.\n\nВесь урок она молчит. В конце говорит: «Спасибо». Не уточняет за что.`},
    {text:"Сесть с другими", effects:()=>{setRel("anya",-1);}, next:"school_crowd",
     after:`Ты садишься к популярным. Они обсуждают кого-то шёпотом. Ты понимаешь — это Аня.`},
    {text:"Сесть одному", effects:()=>{state.flags.loner=true;}, next:"school_alone",
     after:`Ты садишься сзади. В отражении окна — кто-то позади. Оборачиваешься. Пусто.`},
  ]},

school_anya_friend: { bg:"school", text:`Аня улыбается. Вы говорите весь урок — о книгах, о кошках, о чём-то ещё.\n\nОна умная. Почему её никто не любит?`,
  choices:[
    {text:"Пригласить гулять", effects:()=>{setRel("anya",+3);}, next:"street_age12"},
    {text:"Молчать", effects:()=>{setRel("anya",+1);}, next:"next_day"},
  ]},

school_crowd: { bg:"school", text:`Они смеются над Аней — тихо, чтобы не слышала учительница.\n\nДима показывает на неё пальцем. Кто-то прыскает.\n\nТы смеёшься с ними.`,
  choices:[
    {text:"Остановиться", effects:()=>{setRel("anya",+1);state.guilt+=2;}, next:"next_day"},
    {text:"Продолжать", effects:()=>{setRel("anya",-3);}, next:"next_day"},
  ]},

school_alone: { bg:"school", text:`Ты один. В коридоре — зеркало. В отражении — кто-то позади тебя.`,
  choices:[
    {text:"Обернуться", effects:()=>{state.fear+=3;}, next:"next_day"},
    {text:"Не смотреть", effects:()=>{state.fear+=1;}, next:"next_day"},
    {text:"Разбить зеркало", effects:()=>{state.karma-=3;state.fear+=4;}, next:"next_day"},
  ]},

school_corridor_age13: { bg:"corridor", text:`${fmtDate()}.\n\nПеремена. Ты случайно толкаешь Аню. Она падает, учебники рассыпаются. Класс замирает. Потом — смех.\n\nАня смотрит на тебя снизу вверх.`,
  choices:[
    {text:"Помочь встать", effects:()=>{setRel("anya",+3);state.flags.kind=true;}, next:"next_day",
     after:`Ты протягиваешь руку. Она смотрит на неё секунду — потом берёт.\n\n«Спасибо», — говорит тихо. Никто не смеётся.`},
    {text:"Нагрубить", effects:()=>{setRel("anya",-5);state.flags.grudge=true;schedule(84,"anya_revenge");}, next:"next_day",
     after:`«Сама виновата. Смотреть надо». Ты уходишь. Она смотрит тебе в спину.\n\nТы чувствуешь этот взгляд всю неделю.`},
    {text:"Толкнуть сильнее", effects:()=>{setRel("anya",-8);if(Math.random()<.3)die("anya_push",13,"anya");}, next:"next_day",
     after:`Ты наступаешь на её тетрадь. Она не плачет. Просто смотрит. Запоминает.`},
  ]},

street_age12: { bg:"street", text:`${fmtDate()}.\n\nВы гуляете с Аней. Осень. Листья под ногами, холодный воздух.\n\nОна рассказывает про отца, который ушёл два года назад. Голос ровный, будто читает по бумаге.`,
  choices:[
    {text:"Рассказать про подвал", effects:()=>{setRel("anya",+2);}, next:"next_day",
     after:`Аня смотрит странно. «Я тоже его видела».\n\nТы замираешь. «Кого?» Она не отвечает.`},
    {text:"Сменить тему", effects:()=>{setRel("anya",+1);}, next:"next_day"},
    {text:"Толкнуть под машину", effects:()=>{setRel("anya",-10);if(Math.random()<.7){state.flags.killed_someone=true;state.flags.killed_ever=true;}}, next:"next_day"},
  ]},

/* ========== ЗАЩИТА / ПОМОЩЬ ========== */
school_bully_age12: { bg:"school", text:`${fmtDate()}.\n\nСтаршеклассник отобрал твой рюкзак. Он держит его высоко над головой и смеётся. ${F()} рядом, сжав кулаки.`,
  when:()=>flag("lena_friend")&&!flag("lena_left")&&!flag("lena_dead"),
  choices:[
    {text:`Позвать ${F()}`, effects:()=>{const r=lenaProtect();if(r)return r;}, next:"next_day",
     after:`${F()} делает шаг. «Отдай». Он смотрит на ${fE()} — и отдаёт.\n\nТы не понимаешь, чего он испугался.`},
    {text:"Дать сдачи", effects:()=>{if(state.stamina>5)state.stamina-=2;else die("beaten",12);}, next:"next_day",
     after:`Ты бросаешься. Удар. Боль. Ты лежишь на полу. Но рюкзак твой.`},
    {text:"Отдать рюкзак", effects:()=>{setMental(-2);}, next:"next_day"},
  ]},

lena_death: { bg:"hospital", text:`${F()} в больнице. Врач качает головой. «${fHeCap()} не выживет».`,
  choices:[{text:"Держать за руку", effects:()=>{setMental(-3);}, next:"next_day",
   after:`Ты держишь ${fE()} руку. Она холодная.\n\nУтром ${fE()} не станет.`}]},

lena_leaves: { bg:"street", text:`${F()} стоит с рюкзаком. «Я больше не буду твоей тенью». Уходит. Навсегда.`,
  choices:[{text:"Смотреть вслед", effects:()=>{setMental(-2);}, next:"next_day", after:`Ты смотришь, пока ${fHe()} не исчезает из виду.`}]},

lena_neutral_food: { bg:"park", text:`${F()} ест бутерброд. «Хочешь половину?»`,
  when:()=>flag("lena_friend")&&!flag("lena_left")&&!flag("lena_dead"),
  choices:[
    {text:"Взять", effects:()=>{setRel("lena",+1);}, next:"next_day"},
    {text:"Отказаться", effects:()=>{}, next:"next_day"},
    {text:"Съесть весь", effects:()=>{setRel("lena",-1);}, next:"next_day"},
  ]},

lena_neutral_dream: { bg:"park", text:`${F()}: «Кем хочешь стать?»`,
  when:()=>flag("lena_friend")&&!flag("lena_left")&&!flag("lena_dead"),
  choices:[
    {text:"«Врачом»", effects:()=>{setRel("lena",+1);}, next:"next_day"},
    {text:"«Никем»", effects:()=>{setMental(-1);}, next:"next_day"},
    {text:"«Президентом мира»", effects:()=>{state.karma-=1;}, next:"next_day"},
  ]},

lena_needs_help_age14: { bg:"street", text:`${fmtDate()}.\n\n${F()} стоит у твоего подъезда. Глаза красные.\n\n«У меня дома плохо. Можно я переночую у тебя? Только одну ночь».`,
  when:()=>flag("lena_friend")&&!flag("lena_left")&&!flag("lena_dead"),
  choices:[
    {text:"Помочь", effects:()=>{setRel("lena",+3);}, next:"next_day",
     after:`Мать ворчит, но стелет на диване. Ночью ${F()} плачет. Ты просто сидишь рядом.`},
    {text:"Отказать", effects:()=>{setRel("lena",-4);setMental(-1);}, next:"next_day"},
    {text:"Использовать ситуацию", effects:()=>{state.karma-=10;setRel("lena",-10);state.flags.killed_someone=true;state.flags.killed_ever=true;}, next:"next_day"},
  ]},

lena_protect_serious_age15: { bg:"corridor_night", text:`Тебя прижали трое. ${F()} вперёд. «Не трогайте ${g("его","её")}». Голос дрожит.`,
  when:()=>flag("lena_friend")&&!flag("lena_left")&&!flag("lena_dead"),
  choices:[
    {text:"Позволить защитить", effects:()=>{const r=lenaProtect();if(r)return r;}, next:"next_day",
     after:`${fHeCap()} что-то говорит им. Они уходят. ${F()} оборачивается: «Ты как?»`},
    {text:"Встать рядом", effects:()=>{setRel("lena",+2);if(state.stamina>5)state.stamina-=3;else die("beaten",15);}, next:"next_day"},
    {text:`Сбежать, бросив ${F()}`, effects:()=>{state.karma-=10;setRel("lena",-10);const r=lenaUse();if(r)return r;die("lena_avenge",15,"трое");}},
  ]},

/* ========== 15–18 ========== */
club_age16: { bg:"corridor_night", text:`${fmtDate()}. Заброшенный клуб. Тебя пригласили.`,
  choices:[
    {text:"Пойти", effects:()=>{state.fear+=2;}, next:"club_inside"},
    {text:"Отказаться", effects:()=>{}, next:"next_day"},
    {text:"Позвать Аню", effects:()=>{setRel("anya",+2);}, next:"club_with_anya"},
  ]},

club_inside: { bg:"corridor_night", text:`Свечи. Люди в капюшонах. В центре — круг на полу.`,
  choices:[
    {text:"Войти в круг", effects:()=>{state.fear+=5;}, next:"club_ritual"},
    {text:"Стоять у двери", effects:()=>{state.fear+=2;}, next:"club_watch"},
    {text:"Уйти", effects:()=>{}, next:"next_day"},
  ]},

club_ritual: { bg:"corridor_night", text:`Они поют. Что-то тянет вниз. Кто-то берёт за руку.`,
  choices:[
    {text:"Отпустить", effects:()=>{if(state.fear>6)die("ritual",16);}, next:"next_day"},
    {text:"Сжать", effects:()=>{state.fear+=3;}, next:"next_day"},
  ]},

club_watch: { bg:"corridor_night", text:`Один снимает капюшон. Это Аня. Смотрит прямо на тебя.`,
  choices:[
    {text:"Подойти", effects:()=>{setRel("anya",-2);}, next:"next_day"},
    {text:"Уйти", effects:()=>{}, next:"next_day"},
  ]},

club_with_anya: { bg:"corridor_night", text:`Аня у двери: «Ты уверен${g("","а")}?»`,
  choices:[
    {text:"Уверен${g("","а")}", effects:()=>{state.fear+=3;}, next:"club_inside"},
    {text:"Уйти вместе", effects:()=>{setRel("anya",+3);}, next:"next_day"},
  ]},

forest_age17: { bg:"forest", text:`${fmtDate()}. Лес. Кто-то предлагает пойти к колодцу.`,
  choices:[
    {text:"Пойти", effects:()=>{state.fear+=2;}, next:"well_age17"},
    {text:"Остаться у костра", effects:()=>{}, next:"next_day"},
  ]},

well_age17: { bg:"forest", text:`Колодец сухой. На дне — что-то белое.`,
  choices:[
    {text:"Заглянуть", effects:()=>{state.fear+=4;}, next:"next_day"},
    {text:"Оттащить друга", effects:()=>{}, next:"next_day"},
    {text:"Спуститься вниз", effects:()=>{if(Math.random()<.5)die("well",17);}, next:"next_day"},
  ]},

push_from_roof_age16: { bg:"rooftop", text:`Ты на крыше с другом. Он слишком близко к краю.`,
  choices:[
    {text:"Отойти", effects:()=>{}, next:"next_day"},
    {text:"Толкнуть", effects:()=>{state.karma-=20;state.flags.killed_someone=true;state.flags.killed_ever=true;}, next:"next_day",
     after:`Ты толкаешь. Он падает. Ты смотришь вниз. Потом уходишь.`},
    {text:"Схватить за руку", effects:()=>{state.karma+=3;}, next:"next_day"},
  ]},

/* ========== 9 / 11 КЛАСС ========== */
exam9_choice: { bg:"school", text:`${fmtDate()}. Тебе пятнадцать.\n\nОГЭ позади. Аттестат на руках — с тройками и четвёрками. Впереди — выбор.\n\nМарина Павловна собрала вас в классе. «Кто остаётся в десятый? Кто уходит?» ${F()} смотрит на тебя.`,
  when:()=>state.age>=15 && !flag("exam9_done"),
  choices:[
    {text:"Остаться в школе (10–11 класс)", effects:()=>{state.flags.exam9_done=true;state.flags.school_10_11=true;}, next:"next_day",
     after:`Ты подаёшь документы в десятый. ${F()} остаётся с тобой.\n\n«Ну и хорошо», — говорит ${fHe()}. И улыбается.`},
    {text:"Уйти в колледж", effects:()=>{state.flags.exam9_done=true;}, next:"next_day",
     after:`Ты подаёшь в колледж.\n\n${F()} остаётся в школе. Вы обещаете друг другу писать. Первые два месяца пишете. Потом — реже.`},
    {text:"Пойти работать", effects:()=>{state.flags.exam9_done=true;}, next:"next_day",
     after:`Ты идёшь работать. Дворником, как сосед. Мать плачет, но не запрещает.\n\n${F()} смотрит на тебя в день, когда ты приходишь за документами. Ничего не говорит.`},
  ]},

exam11_choice: { bg:"school", text:`${fmtDate()}. Тебе семнадцать.\n\nЕГЭ позади. Баллы пришли по почте. Мать читает их вслух — медленно, будто не верит.`,
  when:()=>state.age>=17 && flag("school_10_11") && !flag("exam11_done"),
  choices:[
    {text:"Университет", effects:()=>{state.flags.exam11_done=true;}, next:"next_day",
     after:`Ты подаёшь в университет. На бюджет — с твоими баллами должно хватить.\n\n${F()} подаёт в другой город. Вы прощаетесь на вокзале. ${fHeCap()} плачет. Ты — нет.`},
    {text:"Колледж", effects:()=>{state.flags.exam11_done=true;}, next:"next_day"},
    {text:"Работа", effects:()=>{state.flags.exam11_done=true;}, next:"next_day"},
    {text:"Армия", when:()=>state.gender==="boy", effects:()=>{state.flags.exam11_done=true;state.flags.army=true;}, next:"next_day",
     after:`Ты идёшь в армию. Мать провожает тебя на сборный пункт.\n\n${F()} стоит рядом, мнёт в руках платок. Не плачет при тебе.`},
  ]},

/* ========== ВЗРОСЛАЯ ЖИЗНЬ ========== */
uni_age19: { bg:"school", text:`${fmtDate()}. Первый курс. ${glance()}Ты сидишь на лекции.\n\nКто-то на заднем ряду предлагает пойти в бар.`,
  choices:[
    {text:"Пойти", effects:()=>{setMental(-1);}, next:"next_day"},
    {text:"Остаться учиться", effects:()=>{}, next:"next_day"},
    {text:"Уйти домой", effects:()=>{}, next:"next_day"},
  ]},

love_age20: { bg:"park", when:()=>!flag("lena_romance")&&!flag("married_lena")&&!flag("married")&&!flag("partner"),
  text:`${fmtDate()}.\n\n${glance()}Ты ${g("влюбился","влюбилась")}. ${g("Её","Его")} зовут ${g("Маша","Миша")}. ${g("Она","Он")} смеётся над твоими шутками.`,
  choices:[
    {text:"Признаться", effects:()=>{setMental(+2);}, next:"love_yes"},
    {text:"Молчать", effects:()=>{setMental(-1);}, next:"next_day"},
  ]},

love_yes: { bg:"park", text:`Ответ: «Я тоже». Что дальше?`,
  choices:[
    {text:"Отношения", effects:()=>{state.flags.partner=true;setMental(+2);}, next:"next_day"},
    {text:"Дружба", effects:()=>{setMental(-1);}, next:"next_day"},
    {text:"Использовать", effects:()=>{state.karma-=5;setMental(-1);}, next:"next_day"},
  ]},

alcohol_age19: { bg:"street", text:`${fmtDate()}. Вечеринка. ${glance()}Тебе предлагают выпить.`,
  choices:[
    {text:"Пить", effects:()=>{setMental(-2);if(Math.random()<.1)die("poisoned",19);}, next:"next_day"},
    {text:"Отказаться", effects:()=>{state.karma+=1;}, next:"next_day"},
    {text:"Пить до беспамятства", effects:()=>{if(Math.random()<.3)die("choke",19);else setMental(-3);}, next:"next_day"},
  ]},

accident_age22: { bg:"road", text:`${fmtDate()}. Дорога. Свет фар. Тормоза.`,
  choices:[
    {text:"Отпрыгнуть", effects:()=>{if(state.stamina<=5)die("car",22);}, next:"next_day"},
    {text:"Замереть", effects:()=>{die("car",22);}},
    {text:"Толкнуть прохожего", effects:()=>{state.karma-=10;if(Math.random()<.5){state.flags.killed_someone=true;state.flags.killed_ever=true;}}, next:"next_day"},
  ]},

job_age22: { bg:"street", text:`${fmtDate()}. Ты ${g("закончил","закончила")} учёбу. Работа?`,
  choices:[
    {text:"Офис", effects:()=>{setMental(-1);}, next:"next_day"},
    {text:"Стройка", effects:()=>{state.stamina+=2;if(Math.random()<.15)die("fall",22);}, next:"next_day"},
    {text:"Своё дело", effects:()=>{state.karma-=1;}, next:"next_day"},
    {text:"Не работать", effects:()=>{setMental(-2);}, next:"next_day"},
  ]},

career_age25: { bg:"street", text:`${fmtDate()}. ${glance()}Начальник предлагает повышение «за компромат на коллегу».`,
  choices:[
    {text:"Согласиться", effects:()=>{state.karma-=5;}, next:"next_day"},
    {text:"Отказаться", effects:()=>{state.karma+=2;}, next:"next_day"},
    {text:"Сдать начальника", effects:()=>{state.karma+=3;if(Math.random()<.3)die("killed_stranger",25,"коллега");}, next:"next_day"},
  ]},

marriage_age28: { bg:"home", text:`${fmtDate()}. ${glance()}Партнёр делает предложение.`,
  when:()=>state.flags.partner && !flag("married") && !flag("married_lena"),
  choices:[
    {text:"Согласиться", effects:()=>{state.flags.married=true;setMental(+1);}, next:"next_day"},
    {text:"Отказаться", effects:()=>{setRel("partner",-5);}, next:"next_day"},
    {text:"Изменить", effects:()=>{state.karma-=5;if(Math.random()<.5)die("killed_lover",28,"партнёр");}, next:"next_day"},
  ]},

child_birth_age30: { bg:"hospital", text:`${fmtDate()}.\n\n${g("Твоя жена рожает","Ты рожаешь")}.`,
  when:()=>state.flags.married && !flag("married_lena") && !flag("child") && !flag("lena_child"),
  choices:[
    {text:"Быть рядом", effects:()=>{setRel("child",+3);setMental(+1);state.flags.child=true;}, next:"next_day"},
    {text:"Уйти курить", effects:()=>{setRel("child",-2);state.flags.child=true;}, next:"next_day"},
    {text:"Сбежать", effects:()=>{state.karma-=10;die("old_alone",state.age,"судьба");}},
  ]},

midlife_age40: { bg:"home", text:`${fmtDate()}. ${glance()}Ты покупаешь спортивную машину или красишь волосы в синий.`,
  choices:[
    {text:"Машина", effects:()=>{}, next:"next_day"},
    {text:"Синие волосы", effects:()=>{setMental(+1);}, next:"next_day"},
    {text:"Пластика", effects:()=>{if(Math.random()<.1)die("surgery",40);}, next:"next_day"},
    {text:"Ничего", effects:()=>{setMental(-1);}, next:"next_day"},
  ]},

family_age35: { bg:"home", text:`${fmtDate()}. Ребёнок спрашивает про подвал в старом доме.`,
  when:()=>flag("child") || flag("lena_child"),
  choices:[
    {text:"Сказать правду", effects:()=>{setRel("child",+2);state.flags.told_truth=true;}, next:"next_day"},
    {text:"Солгать", effects:()=>{state.flags.told_lie=true;}, next:"next_day"},
  ]},

parents_die_age45: { bg:"hospital", text:`${fmtDate()}. ${glance()}Мать при смерти. Врач: «Не доживёт до утра».`,
  choices:[
    {text:"Быть рядом", effects:()=>{setRel("mother",+2);setMental(-2);}, next:"next_day"},
    {text:"Уйти", effects:()=>{setRel("mother",-5);setMental(-3);}, next:"next_day"},
  ]},

health_age50: { bg:"hospital", text:`${fmtDate()}. ${glance()}Анализы плохие. Врач: «Есть варианты».`,
  choices:[
    {text:"Лечиться", effects:()=>{if(Math.random()<.7){}else die("cancer",50);}, next:"next_day"},
    {text:"Отказаться", effects:()=>{die("cancer",50);}},
    {text:"Народная медицина", effects:()=>{if(Math.random()<.3)die("wrong_med",50);}, next:"next_day"},
  ]},

divorce_age52: { bg:"home", text:`${fmtDate()}. ${glance()}Партнёр подаёт на развод.`,
  when:()=>state.flags.married,
  choices:[
    {text:"Согласиться", effects:()=>{setMental(-2);}, next:"next_day"},
    {text:"Бороться", effects:()=>{setMental(-3);if(Math.random()<.3)die("heart",52);}, next:"next_day"},
  ]},

/* ========== РОМАНТИКА ========== */
lena_romance_start: { bg:"park", text:`${fmtDate()}.\n\nВам по восемнадцать.\n\nВы сидите на той самой скамейке, где познакомились двенадцать лет назад. ${F()} грызёт сушку — как тогда. Только теперь ${fHe()} вырос${fA()}, и сушка уже не та, и скамейка кажется меньше.\n\n«Помнишь?» — спрашивает ${fHe()}, не глядя. «Ты мне тогда отдал${g("","а")} половину».`,
  choices:[
    {text:"«Помню. Всё помню»", next:"lena_romance_confess",
     after:`${fHeCap()} поднимает на тебя глаза. Долго смотрит.\n\n«Я тоже. Всё».`},
    {text:"«Ты про сушку?»", effects:()=>{setRel("lena",+1);}, next:"lena_romance_confess",
     after:`${fHeCap()} смеётся — как в детстве, легко и необидно.\n\n«Про сушку тоже. Но не только».`},
    {text:"Уйти от разговора", effects:()=>{setMental(-1);}, next:"next_day",
     after:`Ты меняешь тему. ${fHeCap()} кивает — и больше не возвращается к этому.\n\nВы расходитесь. Что-то осталось несказанным.`},
  ]},

lena_romance_confess: { bg:"park", text:`${F()} откладывает сушку. Смотрит на тебя прямо.\n\n«Слушай. Я давно хотел${fA()} сказать. Все эти годы — ты был${g("","а")} рядом. Ты был${g("","а")}… всем. И я не знаю, что будет дальше, но я не хочу это терять».`,
  choices:[
    {text:"«Я тоже тебя люблю»", effects:()=>{state.flags.lena_romance=true;setRel("lena",+3);setMental(+2);}, next:"lena_romance_yes",
     after:`${fHeCap()} выдыхает — так, будто держал${fA()} воздух двенадцать лет.\n\n«Правда?» — «Правда». ${fHeCap()} улыбается. И плачет. И смеётся одновременно.`},
    {text:"«Давай останемся друзьями»", effects:()=>{setRel("lena",-3);setMental(-2);}, next:"lena_romance_no",
     after:`${fHeCap()} кивает. Медленно.\n\n«Хорошо». И улыбается — но уже не так.`},
    {text:"Молчать", effects:()=>{setRel("lena",-2);}, next:"next_day",
     after:`Ты молчишь. ${fHeCap()} ждёт. Потом встаёт.\n\n«Ладно. Забудь». Уходит.`},
  ]},

lena_romance_yes: { bg:"park", text:`${fHeCap()} берёт тебя за руку. Пальцы холодные — ${fHe()} всегда мёрзнет.\n\n«Ты знаешь, что я тебя люблю с шести лет? С того дня, когда ты ${g("подошёл","подошла")} к скамейке и сказал${g("","а")}, что тебя зовут ${state.name}?»`,
  choices:[
    {text:"«Почему не сказал${fA()} раньше?»", next:"next_day",
     after:`${fHeCap()} пожимает плечами. «Боял${state.gender==="girl"?"ся":"ась"}. Что ты скажешь «нет».\n\nЧто я потеряю тебя совсем».\n\nВы сидите до темноты. Не разговариваете — просто держитесь за руки.`},
    {text:"«Теперь я знаю»", effects:()=>{setMental(+1);}, next:"next_day",
     after:`${fHeCap()} кивает. Кладёт голову тебе на плечо.\n\n«Теперь знаешь».`},
  ]},

lena_romance_no: { bg:"park", text:`${fHeCap()} встаёт. Отряхивает крошки с колен — как в детстве.\n\n«Ладно. Я ${g("пошёл","пошла")}».`,
  choices:[
    {text:"Отпустить", effects:()=>{setMental(-2);}, next:"next_day",
     after:`Ты смотришь, как ${fHe()} уходит. Сушка остаётся на скамейке.\n\nВы всё ещё друзья. Но что-то треснуло.`},
    {text:"Догнать", effects:()=>{state.flags.lena_romance=true;setRel("lena",+3);setMental(+2);}, next:"lena_romance_yes",
     after:`Ты догоняешь ${fE()} у выхода из парка. «Подожди».\n\n${fHeCap()} оборачивается. В глазах — надежда, которую ${fHe()} пытается спрятать.`},
  ]},

lena_proposal: { bg:"home", text:`${fmtDate()}. Вам по двадцать с лишним.\n\n${F()} сидит на диване. Ты — рядом. По телевизору — что-то старое. ${fHeCap()} смеётся над шуткой, которую слышал${fA()} сто раз.\n\nТы смотришь на ${fE()}. И понимаешь: вот оно.`,
  choices:[
    {text:"Сделать предложение", effects:()=>{state.flags.married_lena=true;state.flags.married=true;setMental(+3);setRel("lena",+3);}, next:"lena_wedding",
     after:`Ты встаёшь. Достаёшь кольцо, которое купил${g("","а")} три месяца назад и всё не решал${g("ся","ась")}.\n\n«${F()}. Выходи за меня».`},
    {text:"Подождать ещё год", effects:()=>{state.flags.lena_proposal_seen=false;}, next:"next_day"},
  ]},

lena_wedding: { bg:"park", text:`Свадьба — маленькая. Двадцать человек. На той самой скамейке в парке, где вы познакомились.\n\n${F()} в ${fClothes()}. ${fHeCap()} плачет. Мать плачет. Даже баба Валя пришла — стоит в сторонке, вытирает глаза платком.\n\n«Соглас${state.gender==="girl"?"ен":"на"}», — говорит ${F()}. Голос дрожит.`,
  choices:[
    {text:"«Согласен»", effects:()=>{setMental(+3);}, next:"lena_first_night",
     after:`Вы целуетесь. Кто-то аплодирует. Кто-то свистит.\n\nВечером вы остаётесь вдвоём.`},
    {text:"Молчать от счастья", effects:()=>{setMental(+2);}, next:"lena_first_night",
     after:`Ты не можешь говорить. Просто киваешь.\n\n${fHeCap()} смеётся. «Это да?» Ты киваешь снова.`},
  ]},

lena_first_night: { bg:"home", text:`Ночь. Комната. За окном — фонарь, тени на потолке.\n\n${F()} сидит на краю кровати. Смотрит на тебя. Улыбается — немного нервно.\n\n«Я волнуюсь», — говорит ${fHe()} тихо.`,
  choices:[
    {text:"«Я тоже»", effects:()=>{setMental(+2);setRel("lena",+2);state.flags.lena_first_night=true;}, next:"next_day",
     after:`Ты целуешь ${fE()}. ${fHeCap()} отвечает — сначала неуверенно, потом смелее.\n\nВы поднимаетесь. Дверь закрывается.\n\nУтро приходит слишком быстро. ${fHeCap()} спит рядом, дышит ровно. Ты смотришь на ${fE()} и думаешь: «Вот оно. Вот моя жизнь».`},
    {text:"«Давай просто полежим»", effects:()=>{setMental(+1);setRel("lena",+2);state.flags.lena_first_night=true;}, next:"next_day",
     after:`Вы ложитесь рядом. Смотрите в потолок. ${fHeCap()} кладёт голову тебе на плечо.\n\n«Так тоже хорошо», — говорит ${fHe()}.\n\nВы засыпаете под утро.`},
  ]},

lena_child_talk: { bg:"home", text:`${fmtDate()}.\n\n${F()} держит в руках тест. Две полоски. ${fHeCap()} смотрит на тебя — испуганно и радостно одновременно.\n\n«Что будем делать?» — спрашивает ${fHe()}.`,
  choices:[
    {text:"«Рожать»", effects:()=>{state.flags.lena_child=true;state.flags.child=true;setRel("lena",+3);setMental(+2);setRel("child",+3);}, next:"next_day",
     after:`${fHeCap()} выдыхает. Обнимает тебя так крепко, что рёбра трещат.\n\n«Я боял${state.gender==="girl"?"ся":"ась"}, что ты испугаешься». — «Я испугал${g("ся","ась")}. Но не настолько».`},
    {text:"«А ты как хочешь?»", effects:()=>{setRel("lena",+2);}, next:"lena_child_decide",
     after:`${fHeCap()} задумывается. Потом кивает сам${fA()} себе.\n\n«Хочу».`},
    {text:"«Может, не сейчас?»", effects:()=>{setRel("lena",-5);setMental(-2);}, next:"next_day",
     after:`${fHeCap()} смотрит на тебя. Долго.\n\n«Хорошо». Откладывает тест. Больше не говорит об этом.`},
  ]},

lena_child_decide: { bg:"home", text:`${fHeCap()} смотрит на тест. Потом на тебя. Потом снова на тест.\n\n«Я хочу. Если ты рядом».`,
  choices:[
    {text:"«Я рядом»", effects:()=>{state.flags.lena_child=true;state.flags.child=true;setRel("child",+3);}, next:"next_day",
     after:`${fHeCap()} улыбается. И плачет.\n\nЧерез девять месяцев у вас будет ребёнок.`},
    {text:"«Мне нужно подумать»", effects:()=>{setRel("lena",-3);}, next:"next_day"},
  ]},

lena_family_life: { bg:"home", text:`${fmtDate()}. Утро.\n\n${F()} на кухне — гремит посудой. Ребёнок плачет в комнате. Пахнет молоком и кофе.\n\nТы сидишь за столом. Смотришь в окно. Вспоминаешь, как всё начиналось.`,
  when:()=>flag("married_lena") && flag("lena_child"),
  choices:[
    {text:`Помочь ${F()}`, effects:()=>{setRel("lena",+1);setMental(+1);}, next:"next_day",
     after:`Ты встаёшь, идёшь к ребёнку. ${F()} смотрит на тебя — с благодарностью, которую не нужно произносить вслух.`},
    {text:"Уйти на работу", effects:()=>{}, next:"next_day"},
    {text:"Сидеть и смотреть", effects:()=>{setMental(-1);}, next:"next_day"},
  ]},

/* ========== СТАРОСТЬ ========== */
old_age65: { bg:"home", text:`${fmtDate()}. Тебе шестьдесят пять.\n\nВыход на пенсию. Внуки играют во дворе. Ты смотришь в окно.`,
  choices:[
    {text:"Позвать их", effects:()=>{setMental(+1);}, next:"next_day"},
    {text:"Закрыть шторы", effects:()=>{setMental(-1);}, next:"next_day"},
  ]},

old_75: { bg:"home", text:`${fmtDate()}. 75. Память подводит. Ты забываешь имена.`,
  choices:[
    {text:"Записывать всё", effects:()=>{setMental(+1);}, next:"next_day"},
    {text:"Смириться", effects:()=>{setMental(-2);}, next:"next_day"},
  ]},

old_80: { bg:"home", text:`${fmtDate()}. 80. Врач: «Вам осталось немного».`,
  choices:[
    {text:"Позвать всех", effects:()=>{if(rel("child")>=3||rel("lena")>=5)die("old_family",80);else die("old_alone",80);}},
    {text:"Принять таблетки", effects:()=>{die("pills",80);}},
    {text:"Просто сидеть", effects:()=>{die("old_sleep",80);}},
  ]},

old_age_loop: { bg:"home", text:`${fmtDate()}. ${glance()}Ещё год. Вопрос — зачем?`,
  choices:[
    {text:"Продолжать", effects:()=>{
      if(state.age<75) return "old_75";
      if(state.age<80) return "old_80";
      die("old_age",state.age);
    }},
    {text:"Закончить самому", effects:()=>{die("pills",state.age);}},
  ]},

/* ========== ДЕНЬ РОЖДЕНИЯ ========== */
birthday_kid: { bg:"home", text:`28 ноября. Тебе ${state.age}.\n\nТорт на столе. Свечи. Мать стоит рядом, улыбается — но глаза грустные.`,
  when:()=>state.age<12,
  choices:[
    {text:"Задуть свечи", effects:()=>{setMental(+2);}, next:"next_day",
     after:`Ты задуваешь. Один огонёк не гаснет. Дуешь ещё раз — исчезает.\n\nМать улыбается. Но в глазах — что-то ещё.`},
    {text:`Позвать ${F()}`, when:()=>flag("lena_friend")&&!flag("lena_dead")&&!flag("lena_left"), effects:()=>{setRel("lena",+1);setMental(+1);}, next:"next_day",
     after:`${F()} приходит с самодельной открыткой. На ней — две фигурки и солнце.\n\n«Это мы», — говорит ${fHe()}. Ты вешаешь открытку над кроватью.`},
  ]},

birthday_teen: { bg:"home", text:`28 ноября. Тебе ${state.age}.\n\nДень рождения.`,
  when:()=>state.age>=12&&state.age<19,
  choices:[
    {text:"С семьёй", effects:()=>{setRel("mother",+1);setMental(+1);}, next:"next_day"},
    {text:"Вечеринку", effects:()=>{setMental(+2);}, next:"next_day"},
  ]},

birthday_adult: { bg:"home", text:`28 ноября. Тебе ${state.age}.`,
  when:()=>state.age>=19&&state.age<65,
  choices:[
    {text:"С близкими", effects:()=>{setMental(+2);}, next:"next_day"},
    {text:"Работать", effects:()=>{setMental(-1);}, next:"next_day"},
  ]},

birthday_old: { bg:"home", text:`28 ноября. Тебе ${state.age}.`,
  when:()=>state.age>=65,
  choices:[
    {text:"Принять гостей", effects:()=>{if(rel("child")>=3||rel("lena")>=5)setMental(+2);else setMental(-1);}, next:"next_day"},
    {text:"Побыть одному", effects:()=>{setMental(-1);}, next:"next_day"},
  ]},

/* ========== ДЕМЕНЦИЯ ========== */
dementia_crisis: { bg:"home", text:`${fmtDate()}. Ты не помнишь, как сюда попал${g("","а")}.\n\nКомната знакомая, но чужая. На столе — фото. Кто эти люди?`,
  choices:[
    {text:"Позвонить ребёнку", effects:()=>{if(rel("child")>=3)setMental(+1);else setMental(-2);}, next:"next_day"},
    {text:"Выйти на улицу", effects:()=>{if(Math.random()<.3)die("lost",state.age);setMental(-2);}, next:"next_day"},
    {text:"Сесть и ждать", effects:()=>{setMental(-1);}, next:"next_day"},
  ]},

dementia_aggression: { bg:"home", text:`${fmtDate()}. Кто-то трогает твои вещи. Ты не помнишь, кто. Но он — враг.`,
  choices:[
    {text:"Ударить", effects:()=>{state.karma-=5;if(Math.random()<.3){state.flags.killed_someone=true;state.flags.killed_ever=true;}}, next:"next_day"},
    {text:"Крикнуть", effects:()=>{setMental(-2);}, next:"next_day"},
    {text:"Спрятаться", effects:()=>{setMental(-1);}, next:"next_day"},
  ]},

/* ========== ПСИХУШКА ========== */
psych_ward: { bg:"psych", text:`${fmtDate()}. Тебя забрали.\n\nБелые стены, решётки. Врач: «Мы поможем тебе забыть».`,
  choices:[
    {text:"Сотрудничать", effects:()=>{setMental(-2);}, next:"next_day",
     after:`Тебя ведут в палату. Ты считаешь шаги. Их ровно сорок три.`},
    {text:"Бунтовать", effects:()=>{setMental(-3);if(Math.random()<.5)die("psych_kill",state.age,"персонал");}, next:"next_day"},
    {text:"Притвориться здоровым", effects:()=>{if(state.mental>=6){state.flags.psych_ward=false;state.flags.psych_kill_done=true;state.flags.psych_healthy=true;setMental(+2);}else setMental(-2);}, next:"next_day",
     after:`Ты улыбаешься. Говоришь ровно. Врач смотрит в бумаги. «Что ж. Пожалуй, вы готовы».`},
  ]},

psych_ward_loop: { bg:"psych", text:`${fmtDate()}. День в палате. Ты считаешь трещины на потолке.`,
  choices:[
    {text:"Смириться", effects:()=>{}, next:"next_day"},
    {text:"Планировать побег", effects:()=>{if(state.stamina>5&&Math.random()<.2){state.flags.psych_ward=false;state.flags.psych_escaped=true;state.flags.psych_kill_done=true;setMental(+1);return "psych_escape_success";}else setMental(-1);}, next:"next_day"},
  ]},

psych_final_choice: { bg:"psych", text:`${fmtDate()}. Прошло двенадцать дней.\n\nВрач заходит в палату с папкой. Смотрит в бумаги, потом на тебя.\n\n«${state.name}. Завтра — последняя процедура. После неё — либо поправишься, либо...» Он не договаривает.\n\nНочью окно в коридоре приоткрыто. Решётка ослаблена. Санитар спит на посту.`,
  choices:[
    {text:"Остаться. Пройти лечение", next:"psych_treatment_result",
     after:`Ты ложишься обратно. Смотришь в потолок. Считаешь трещины — их сорок три.\n\nУтром тебя ведут в кабинет.`},
    {text:"Сбежать", effects:()=>{
      if(Math.random() < 0.5){
        state.flags.psych_ward = false;
        state.flags.psych_escaped = true;
        state.flags.psych_kill_done = true;
        setMental(+2);
        return "psych_escape_success";
      } else {
        state.flags.psych_start_day = state.day;
        state.flags.psych_extra = (state.flags.psych_extra||0) + 1;
        setMental(-3);
        return "psych_escape_fail";
      }
    }},
  ]},

psych_treatment_result: { bg:"psych", text:`Кабинет. Ремни на руках. Аппарат с проводами. Врач с холодными пальцами.\n\n«Считай до десяти», — говорит он.`,
  choices:[
    {text:"Считать", effects:()=>{
      if(Math.random()*100 < 5){
        die("psych_kill", state.age, "персонал");
        return null;
      } else {
        state.flags.psych_ward = false;
        state.flags.psych_healthy = true;
        state.flags.psych_kill_done = true;
        state.flags.killed_someone = false;
        setMental(+4);
        return "psych_healthy_exit";
      }
    }},
  ]},

psych_escape_success: { bg:"street", text:`Ты бежишь босиком по холодному асфальту. За спиной — крики, но они стихают.\n\nЧерез час ты у своей двери. Мать открывает, вскрикивает, обнимает — так крепко, что рёбра трещат.\n\n«Я думала, тебя больше нет».`,
  choices:[
    {text:"Обнять в ответ", effects:()=>{setRel("mother",+3);setMental(+2);state.flags.killed_someone=false;}, next:"next_day",
     after:`Ты обнимаешь её. Она пахнет кухней и страхом.\n\nТы дома. Ты на свободе. Но то, что было в палате, останется с тобой навсегда.`},
    {text:"Молча войти", effects:()=>{state.flags.killed_someone=false;}, next:"next_day",
     after:`Ты проходишь мимо неё в комнату. Закрываешь дверь. Садишься на кровать.\n\nСмотришь в стену. Долго.`},
  ]},

psych_escape_fail: { bg:"psych", text:`Ты добегаешь до двери. Она заперта — новый замок, блестящий.\n\nСзади — шаги. Рука санитара хватает тебя за плечо.\n\n«Куда собрал${g("ся","ась")}?»\n\nТебя возвращают в палату. Врач делает пометку: «Попытка побега. Продлить срок».`,
  choices:[
    {text:"Смириться", effects:()=>{}, next:"next_day",
     after:`Ты ложишься на койку. Смотришь в потолок.\n\nПроходит ещё двенадцать дней.`},
    {text:"Кричать", effects:()=>{setMental(-2);}, next:"next_day",
     after:`Ты кричишь, пока не хрипнешь. Никто не приходит.\n\nПроходит ещё двенадцать дней.`},
  ]},

psych_healthy_exit: { bg:"hospital", text:`Ты просыпаешься в белой палате — но это не психушка. Обычная больница. За окном — утро, настоящее, с птицами.\n\nВрач улыбается — впервые по-настоящему. «Ты справил${g("ся","ась")}. Все анализы в норме. Ты здоров${g("","а")}».\n\nМать сидит рядом. Она плачет — но от облегчения.`,
  choices:[
    {text:"Встать", effects:()=>{setMental(+3);}, next:"next_day",
     after:`Ты встаёшь. Ноги держат. Мать подаёт куртку.\n\nТы выходишь на улицу. Солнце бьёт в глаза.`},
    {text:"Полежать ещё", effects:()=>{setMental(+1);}, next:"next_day",
     after:`Ты лежишь ещё час. Смотришь в окно. Птицы. Облака. Всё как раньше.\n\nНо ты — друг${g("ой","ая")}.`},
  ]},

/* ========== НИЗКАЯ ПСИХИКА ========== */
low_mental_glances: { bg:"street", text:`${fmtDate()}.\n\n${glance()}Прохожие смотрят косо. Кто-то переходит на другую сторону.`,
  choices:[
    {text:"Игнорировать", effects:()=>{setMental(-1);}, next:"next_day"},
    {text:"Улыбнуться", effects:()=>{setMental(+1);}, next:"next_day"},
    {text:"Крикнуть", effects:()=>{setMental(-2);state.karma-=3;}, next:"next_day"},
  ]},

/* ========== НЕЙТРАЛЬНЫЕ ========== */
neutral_dinner: { bg:"home", text:`${fmtDate()}.\n\nВечер. Мать на кухне. Пахнет жареной картошкой.\n\n«Что нового в школе?» — спрашивает она, не оборачиваясь.`,
  choices:[
    {text:"«Ничего»", next:"next_day"},
    {text:"«Всё нормально»", effects:()=>{setRel("mother",+1);}, next:"next_day"},
    {text:"Рассказать про день", effects:()=>{setRel("mother",+2);}, next:"next_day",
     after:`Ты рассказываешь — про учительницу, про ${F()}, про то, как на перемене кто-то уронил компот.\n\nМать слушает. Улыбается. Впервые за долгое время — искренне.`},
  ]},

neutral_weather: { bg:"street", text:`${fmtDate()}.\n\nУтро. За окном — дождь. Мать говорит: «Надень куртку».`,
  choices:[
    {text:"Надеть", next:"next_day"},
    {text:"Не надеть", effects:()=>{if(Math.random()<.3)die("pneumonia",state.age);setMental(-1);}, next:"next_day"},
  ]},

/* ========== СОБЫТИЯ ========== */
event_anya_revenge: { bg:"corridor_night", text:`${fmtDate()}. Она в конце коридора. В руке — что-то блестящее.`,
  when:()=>rel("anya")<-3&&flag("grudge"),
  choices:[
    {text:"Подойти", effects:()=>{playSfx("glitch");shake();die("anya_stab",state.age,"anya");}},
    {text:"Бежать", effects:()=>{if(state.stamina>5)schedule(30,"anya_revenge");else{playSfx("glitch");shake();die("anya_stab",state.age,"anya");}}, next:"next_day"},
    {text:"Крикнуть", effects:()=>{playSfx("glitch");shake();die("anya_stab",state.age,"anya");}},
  ]},

day_start: { bg:"home", text:`Новый день.`, choices:[{text:"Продолжить", next:"next_day"}]},

};
}

/* ============ ПУЛЫ ============ */
const POOL_6 = ["home_age6","neutral_dinner","neutral_weather","neighbor_bab_valya","dima_bully"];
const POOL_12 = ["school_age12","school_bully_age12","lena_neutral_food","lena_neutral_dream",
                 "school_corridor_age13","dima_bully","neighbor_bab_valya","low_mental_glances"];
const POOL_16 = ["club_age16","forest_age17","lena_needs_help_age14","lena_protect_serious_age15","push_from_roof_age16"];
const POOL_19 = ["uni_age19","love_age20","alcohol_age19","accident_age22","job_age22"];
const POOL_23 = ["career_age25","marriage_age28","child_birth_age30","midlife_age40"];
const POOL_35 = ["family_age35","parents_die_age45","health_age50","divorce_age52"];
const POOL_50 = ["health_age50","dementia_aggression","divorce_age52"];
const POOL_65 = ["old_age65","old_75","old_80","dementia_crisis"];
const ORPHAN_POOL = ["orphan_bully","orphan_adoption"];

function getPool(){
  const a = state.age;
  if(a<12){
    if(flag("basement_seen")) return ["neutral_dinner","neutral_weather","neighbor_bab_valya","dima_bully"];
    return POOL_6;
  }
  if(a<16) return POOL_12;
  if(a<19) return POOL_16;
  if(a<23) return POOL_19;
  if(a<35) return POOL_23;
  if(a<50) return POOL_35;
  if(a<65) return POOL_50;
  return POOL_65;
}

/* ============ ДВИЖОК ============ */
const app = document.getElementById("app");

function shake(){
  const el = document.querySelector(".scene") || app;
  el.classList.add("shake");
  setTimeout(()=>el.classList.remove("shake"),800);
}

function die(cause, atAge, killer=null){
  state.deathCause = DEATHS[cause] || cause;
  state.deathAge = atAge;
  state.killer = killer;
  showDeath();
}

function buildEpilogue(){
  const parts = [`Ты ${g("умер","умерла")} в ${state.deathAge} лет.`,`Причина: ${state.deathCause}.`];
  const r = n => state.relations[n] ?? 0;

  if(state.killer && r(state.killer)<=-5) parts.push("Это сделал тот, кого ты когда-то обидел.");
  if(r("mother")>=5) parts.push("Мать не пережила. Она приходила на могилу каждый день.");
  else if(r("mother")<=-3) parts.push("Мать узнала слишком поздно. Она даже не пришла.");
  if(r("anya")>=3) parts.push("Аня пришла на похороны. Она плакала.");
  else if(r("anya")<=-5) parts.push("Аня не пришла. Она знала, что так будет.");
  if(r("lena")>=5) parts.push(`${F()} был${fA()} рядом до конца.`);
  else if(r("lena")<=-5) parts.push(`${F()} не приш${fA()}. Ты сам${g("","а")} оттолкнул${g("","а")}.`);
  if(r("child")>=3) parts.push("Твой ребёнок держал тебя за руку.");

  if(state.mental<=2) parts.push("Психика была разрушена задолго до конца.");
  if(flag("kind")) parts.push("Кто-то вспомнил, что ты был${g("","а")} добр${g("","а")}.");
  if(flag("mother_believes")) parts.push("Мать верила тебе. До конца.");
  if(flag("moved")) parts.push("Вы переехали. И оно не пошло за вами.");
  if(flag("psych_healthy")) parts.push("Ты вышел из психушки здоровым. Но помнил всё.");
  if(flag("psych_escaped")) parts.push("Ты сбежал. Они так и не нашли тебя.");
  if(flag("psych_ward")&&!flag("psych_healthy")&&!flag("psych_escaped")) parts.push("Тебя держали в психушке. Ты умер там.");
  if(flag("killed_ever")) parts.push("Ты убил человека. Это осталось с тобой.");
  if(flag("lena_dead")) parts.push(`${F()} умер, защищая тебя.`);
  if(flag("lena_left")) parts.push(`${F()} отвернулся от тебя.`);

  if(state.guilt>5) parts.push("Последнее, что ты чувствовал — вина.");
  if(state.fear>10) parts.push("Последнее, что ты чувствовал — страх.");

  const key=[
    state.deathCause,state.deathAge,state.killer||"-",
    flag("kind")?"k":"-",flag("moved")?"m":"-",
    flag("lena_dead")?"ld":"-",flag("lena_left")?"ll":"-",
    flag("psych_healthy")?"ph":"-",flag("psych_escaped")?"pe":"-",
    flag("killed_ever")?"ks":"-",
    state.mental<=2?"m2":"-",
  ].join("_");
  state.seenEndings.add(key);
  return parts.join(" ");
}

function showDeath(){
  const ep = buildEpilogue();
  playSfx("heartbeat");
  app.classList.add("fade-out");
  setTimeout(()=>{
    app.innerHTML=`
      <div class="death-screen">
        <p>${ep}</p>
        <p class="counter">Концовка: ${state.seenEndings.size} · Возраст: ${state.deathAge} · ${fmtDate()}</p>
        <button id="restart">Начать заново</button>
      </div>`;
    document.getElementById("restart").onclick=()=>location.reload();
    app.classList.remove("fade-out");
  },350);
}

function playScene(id){
  if(id==="next_day"||id==="auto_day") return advanceDay();
  let scene = scenes[id];
  if(!scene){
    console.warn("Нет сцены:", id, "→ пропуск");
    return advanceDay();
  }

  if(typeof scene === "function") scene = scene();

  const due = checkTimers();
  if(due.length && !id.startsWith("event_")) return playScene("event_"+due[0].event);

  if(scene.when && !scene.when()) return playScene("next_day");

  // психушка после убийства (только если не обработано)
  if(flag("killed_someone") && !flag("psych_ward") && !flag("psych_checked") && !flag("psych_escaped") && !flag("psych_healthy") && !flag("psych_kill_done")){
    state.flags.psych_checked = true;
    state.flags.psych_ward = true;
    state.flags.psych_start_day = state.day;
    setMental(-5);
    return playScene("psych_ward");
  }

  // детдом
  if(flag("orphan") && !flag("orphan_done") && !id.startsWith("orphan_")){
    state.flags.orphan_done = true;
    return playScene("orphan_home");
  }

  render(scene);
}

const OUTDOOR_BGS = ["school","park","street","corridor","corridor_night","neighbor"];

function render(scene){
  app.classList.add("fade-out");
  setTimeout(()=>{
    const mentClass = state.mental<=2 ? "low" : "";
    app.innerHTML=`
      <div class="scene">
        <div class="scene-inner">
          <div class="status">
            <span>${state.name}</span>
            <span>${fmtDate()} · ${state.age} ${state.age<5?"года":"лет"}</span>
            <span class="${mentClass}">${starStr(state.mental)}</span>
          </div>
          <p class="text">${scene.text}</p>
          <div class="choices"></div>
        </div>
      </div>`;
    const sceneEl = app.querySelector(".scene");
    sceneEl.style.background = BG[scene.bg] || BG.home;

    const box = app.querySelector(".choices");
    if(scene.choices){
      scene.choices.forEach(c=>{
        if(c.when && !c.when()) return;
        const b = document.createElement("button");
        b.textContent = c.text;
        b.onclick = ()=>{
          getCtx();
          const jumpTo = c.effects?.();
          if(state.deathCause) return;
          if(c.after){
            let afterText = c.after;
            if(OUTDOOR_BGS.includes(scene.bg)){
              const homeLines = [
                "\n\nТы вернул${g("ся","ась")} домой. Мать на кухне — гремит посудой. Пахнет ужином.",
                "\n\nТы вернул${g("ся","ась")} домой. В коридоре темно. Мать уже спит — свет только на кухне.",
                "\n\nТы вернул${g("ся","ась")} домой. Снял${g("","а")} куртку, повесил${g("","а")} на крючок. Дома тихо.",
                "\n\nТы вернул${g("ся","ась")} домой. Мать спросила, как дела. Ты сказал${g("","а")}: «Нормально». Она кивнула.",
              ];
              afterText += homeLines[Math.floor(Math.random()*homeLines.length)];
            }
            showAfter(afterText, jumpTo || c.next || "next_day");
            return;
          }
          playScene(jumpTo || c.next || "next_day");
        };
        box.appendChild(b);
      });
    } else {
      const b = document.createElement("button");
      b.textContent = "Дальше";
      b.onclick = ()=>{getCtx();playScene(scene.next||"next_day");};
      box.appendChild(b);
    }
    app.classList.remove("fade-out");
  },350);
}

function showAfter(text, next){
  app.classList.add("fade-out");
  setTimeout(()=>{
    app.innerHTML = `
      <div class="scene">
        <div class="scene-inner">
          <div class="status">
            <span>${state.name}</span>
            <span>${fmtDate()} · ${state.age} ${state.age<5?"года":"лет"}</span>
            <span class="${state.mental<=2?"low":""}">${starStr(state.mental)}</span>
          </div>
          <p class="text after-text">${text}</p>
          <div class="choices"><button id="contBtn">Дальше</button></div>
        </div>
      </div>`;
    document.getElementById("contBtn").onclick = ()=>{
      app.classList.remove("fade-out");
      playScene(next);
    };
    app.classList.remove("fade-out");
  },350);
}

function advanceDay(){
  state.d += 1;
  const dim = new Date(state.y, state.m, 0).getDate();
  if(state.d > dim){ state.d = 1; state.m += 1; }
  if(state.m > 12){ state.m = 1; state.y += 1; }
  state.day += 1;

  if(flag("killed_someone")) setMental(-1);
  if(state.fear>8) setMental(-1);
  if(state.guilt>8) setMental(-1);

  // в психушке/детдоме — только их сцены
  if(flag("psych_ward") || flag("orphan")) return autoDay();

  // день рождения 28.11
  if(state.m === 11 && state.d === 28 && !state.flags["_bd_"+state.y]){
    state.flags["_bd_"+state.y] = true;
    state.age += 1;
    if(state.age<12) return playScene("birthday_kid");
    if(state.age<19) return playScene("birthday_teen");
    if(state.age<65) return playScene("birthday_adult");
    return playScene("birthday_old");
  }

  // вопросы учителя
  if(state.age >= 7 && state.age <= 17){
    const lastTeacher = state.flags.teacherLastDay || 0;
    if(state.day - lastTeacher >= 14 && Math.random() < 0.15){
      state.flags.teacherLastDay = state.day;
      return render(buildTeacherScene());
    }
  }

  // деменция
  if(state.age >= 50){
    state.dementia = Math.min(10, state.dementia + (Math.random()<.3?1:0));
    if(Math.random()<.4){
      const delta = Math.random()<.6 ? -(1+Math.floor(Math.random()*3)) : +(1+Math.floor(Math.random()*2));
      setMental(delta);
    }
    if(state.dementia >= 8 && Math.random() < .25){
      return playScene("dementia_crisis");
    }
  }

  // сущность: раз в 6-12 месяцев
  if(state.age >= 7 && state.age < 16 && state.thingLevel < 5 && !flag("moved") && !flag("orphan") && !flag("psych_ward")){
    if(state.day >= state.thingNextDay){
      state.thingNextDay = state.day + 180 + Math.floor(Math.random()*180);
      state.thingLevel += 1;
      return playScene("thing_event_" + state.thingLevel);
    }
  }

  // 9 класс
  if(state.age>=15 && !flag("exam9_done")) return playScene("exam9_choice");
  // 11 класс
  if(state.age>=17 && flag("school_10_11") && !flag("exam11_done")) return playScene("exam11_choice");

  autoDay();
}

function autoDay(){
  // психушка
  if(flag("psych_ward") && !flag("psych_kill_done")){
    const startDay = state.flags.psych_start_day || state.day;
    if(state.day >= startDay + 12){
      state.flags.psych_start_day = state.day;
      return playScene("psych_final_choice");
    }
    return playScene("psych_ward_loop");
  }

  // детдом
  if(flag("orphan") && !flag("adopted") && !flag("orphan_free")){
    if(!flag("orphan_intro_done")){
      state.flags.orphan_intro_done = true;
      return playScene("orphan_home");
    }
    return playScene(pickScene(ORPHAN_POOL));
  }

  // месть Ани
  if(flag("grudge") && rel("anya")<-3 && state.age>=16 && state.age<45 && !flag("revenge_done")){
    state.flags.revenge_done = true;
    return playScene("event_anya_revenge");
  }

  // попытка переезда
  if(state.thingLevel >= 3 && !flag("moved") && !flag("move_shown_"+state.thingLevel)){
    state.flags["move_shown_"+state.thingLevel] = true;
    if(Math.random() < .4) return playScene("thing_beg_move");
  }

  // романтика
  if(flag("lena_friend") && !flag("lena_dead") && !flag("lena_left")
     && rel("lena")>=5 && state.age>=18 && !flag("lena_romance") && !flag("married")
     && !flag("partner")){
    return playScene("lena_romance_start");
  }

  if(flag("lena_romance") && !flag("married_lena") && state.age>=20 && rel("lena")>=7
     && !flag("lena_proposal_seen") && Math.random()<.4){
    state.flags.lena_proposal_seen = true;
    return playScene("lena_proposal");
  }

  if(flag("married_lena") && !flag("lena_first_night") && Math.random()<.3){
    state.flags.lena_first_night = true;
    return playScene("lena_first_night");
  }

  if(flag("married_lena") && !flag("lena_child") && state.age>=22 && rel("lena")>=7
     && !flag("lena_child_seen") && Math.random()<.25){
    state.flags.lena_child_seen = true;
    return playScene("lena_child_talk");
  }

  // семейная жизнь
  if(flag("married_lena") && flag("lena_child") && Math.random()<.3){
    return playScene("lena_family_life");
  }

  // старость
  if(state.age>=65){
    if(!flag("old_done")){state.flags.old_done=true;return playScene("old_age65");}
    return playScene("old_age_loop");
  }

  // низкая психика
  if(lowMentalActive() && !flag("low_mental_seen") && Math.random()<.3){
    state.flags.low_mental_seen = true;
    return playScene("low_mental_glances");
  }

  playScene(pickScene(getPool()));
}

/* ============ СТАРТ ============ */
function startScreen(){
  app.classList.remove("fade-out");
  app.innerHTML = `
    <div class="scene">
      <div class="scene-inner">
        <div class="status"><span>Новая жизнь · ${fmtDate()}</span></div>
        <p class="text">Как тебя зовут?</p>
        <input id="nameInput" class="name-input" maxlength="20" placeholder="Имя" autocomplete="off">
        <div class="choices"><button id="btnOk">Дальше</button></div>
      </div>
    </div>`;
  const input = document.getElementById("nameInput");
  input.focus();
  const go = () => {
    const v = input.value.trim();
    if(v.length < 1){ input.placeholder = "Введи имя"; input.focus(); return; }
    state.name = v;
    genderScreen();
  };
  document.getElementById("btnOk").onclick = go;
  input.onkeydown = e => { if(e.key === "Enter") go(); };
}

function genderScreen(){
  app.innerHTML = `
    <div class="scene">
      <div class="scene-inner">
        <div class="status"><span>Имя: ${state.name}</span></div>
        <p class="text">Ты девочка или мальчик?</p>
        <div class="choices">
          <button data-g="girl">Девочка</button>
          <button data-g="boy">Мальчик</button>
        </div>
      </div>
    </div>`;
  document.querySelectorAll("[data-g]").forEach(b=>{
    b.onclick = ()=>{
      state.gender = b.dataset.g;
      scenes = initScenes();
      playScene("first_day_school");
    };
  });
}

startScreen();
